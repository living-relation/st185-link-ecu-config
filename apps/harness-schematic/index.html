<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ST185 Harness — Schematic</title>
<style>
  :root{
    --bg:#0b0b0d; --panel:#141416; --panel2:#1a1a1e; --border:#2c2c32;
    --text:#f2f2f4; --muted:#8b8b96; --accent:#3dd68c; --warn:#e8b849; --danger:#e85d5d;
    --canvas:#0e0e10; --grid:#1a1a20; --comp:#1c1c20; --comp-bd:#3e3e46; --hdr:#16161a;
    --handle:#c8c8d0; --sel:#5b8def;
    --mono:"IBM Plex Mono","Cascadia Code",ui-monospace,Menlo,monospace;
    --sans:"IBM Plex Sans",Inter,system-ui,sans-serif;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);font-family:var(--sans);overflow:hidden}
  #app{display:grid;grid-template-rows:48px 1fr 34px;grid-template-columns:236px 1fr 290px;height:100%}
  #app.wide{grid-template-columns:0 1fr 0}
  #app.wide aside{display:none}
  header{grid-column:1/-1;display:flex;align-items:center;gap:12px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--border)}
  .logo{display:flex;align-items:center;gap:8px;font-weight:700;letter-spacing:.02em;white-space:nowrap}
  .logo-mark{display:flex;gap:3px}
  .logo-mark i{display:block;width:3px;height:16px;border-radius:1px;transform:skewX(-18deg)}
  .logo-mark i:nth-child(1){background:#f5c542}
  .logo-mark i:nth-child(2){background:#f08a2a}
  .logo-mark i:nth-child(3){background:#8b5cf6}
  header .sp{flex:1}
  header button.tool, .lib-item, footer button, .mini{
    background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;
    padding:6px 10px;font:inherit;font-size:12px;cursor:pointer;white-space:nowrap
  }
  header button.tool:hover,.lib-item:hover,footer button:hover,.mini:hover{border-color:#5a5a66}
  header button.tool.on{background:#243043;border-color:var(--sel);color:#dce8ff}
  select.tool{background:var(--panel2);color:var(--text);border:1px solid var(--border);border-radius:6px;padding:6px 8px;font:inherit;font-size:12px}
  .kbd{font-family:var(--mono);font-size:10px;color:var(--muted);border:1px solid var(--border);padding:1px 5px;border-radius:4px}
  aside{background:var(--panel);border-right:1px solid var(--border);overflow:auto;padding:10px}
  #inspector{border-right:0;border-left:1px solid var(--border)}
  .aside-h{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 0 6px;display:flex;align-items:center;gap:6px}
  .aside-h:first-child{margin-top:2px}
  .aside-h .sp{flex:1}
  .lib-item{display:flex;width:100%;text-align:left;margin:0 0 6px;gap:8px;align-items:center}
  .lib-item .ic{width:22px;color:var(--muted);font-family:var(--mono);font-size:11px}

  .layer{display:flex;align-items:center;gap:7px;padding:4px 5px;border-radius:6px;font-size:12px;cursor:default}
  .layer:hover{background:#1e1e24}
  .layer input{margin:0;cursor:pointer}
  .layer .sw{width:9px;height:9px;border-radius:2px;flex:none}
  .layer .nm{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .layer .ct{color:var(--muted);font-family:var(--mono);font-size:10px}
  .layer .solo{background:transparent;border:1px solid transparent;color:var(--muted);font-size:10px;
    padding:1px 5px;border-radius:4px;cursor:pointer;opacity:0;font-family:var(--sans)}
  .layer:hover .solo{opacity:1}
  .layer .solo:hover{border-color:var(--border);color:var(--text)}
  .layer.off .nm,.layer.off .ct{opacity:.4}

  #lib-search{width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);
    border-radius:6px;padding:6px 8px;font:inherit;font-size:12px;margin-bottom:6px}
  .lib-row{display:flex;gap:8px;align-items:center;width:100%;text-align:left;margin:0 0 5px;
    background:var(--panel2);border:1px solid var(--border);border-radius:6px;padding:5px 7px;cursor:pointer}
  .lib-row:hover{border-color:#5a5a66;background:#202026}
  .lib-thumb{width:30px;height:24px;border-radius:4px;flex:none;background:#3a3a42;
    background-size:cover;background-position:center;border:1px solid #4a4a54}
  .lib-meta{flex:1;min-width:0}
  .lib-nm{font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .lib-sub{font-size:10px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
    font-family:var(--mono)}
  .lib-edit{background:transparent;border:0;color:var(--muted);font-size:11px;cursor:pointer;padding:2px 4px;opacity:0}
  .lib-row:hover .lib-edit{opacity:1}
  .lib-edit:hover{color:var(--text)}
  .lib-empty{font-size:11px;color:var(--muted);padding:6px 2px;line-height:1.5}
  .row-btns{display:flex;gap:6px;margin-bottom:8px}
  .row-btns .mini{flex:1;text-align:center}

  #modal-bg{position:fixed;inset:0;background:#000a;z-index:40;display:none;align-items:center;justify-content:center}
  #modal-bg.on{display:flex}
  .modal{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:16px;
    width:min(560px,92vw);max-height:88vh;overflow:auto;box-shadow:0 24px 70px #000c}
  .modal h3{margin:0 0 4px;font-size:14px}
  .modal .sub{font-size:11px;color:var(--muted);margin:0 0 14px;line-height:1.5}
  .modal label{display:block;font-size:11px;color:var(--muted);margin:10px 0 4px}
  .modal input[type=text], .modal textarea, .modal select{width:100%;background:var(--bg);color:var(--text);
    border:1px solid var(--border);border-radius:5px;padding:6px 8px;font:inherit;font-size:12px}
  .modal .two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
  .modal .acts{display:flex;gap:8px;justify-content:flex-end;margin-top:16px}
  .modal .warn{color:var(--warn);font-size:11px;margin-top:8px;line-height:1.5}
  .modal .err{color:var(--danger);font-size:11px;margin-top:8px;line-height:1.5}
  .modal .okmsg{color:var(--accent);font-size:11px;margin-top:8px;line-height:1.5}
  details.sect{border:1px solid var(--border);border-radius:6px;margin:8px 0;background:var(--panel2)}
  details.sect>summary{cursor:pointer;padding:6px 8px;font-size:11px;letter-spacing:.06em;
    text-transform:uppercase;color:var(--muted);list-style:none;display:flex;align-items:center;gap:6px}
  details.sect>summary::-webkit-details-marker{display:none}
  details.sect>summary:before{content:"\25B8";font-size:9px;transition:transform .12s}
  details.sect[open]>summary:before{transform:rotate(90deg)}
  details.sect>summary .ct{margin-left:auto;font-family:var(--mono);font-size:10px}
  .sect-body{padding:6px 8px 10px}
  .kv{display:grid;grid-template-columns:1fr auto;gap:6px;align-items:center;
    font-size:11px;padding:4px 0;border-top:1px solid #ffffff0d}
  .kv:first-child{border-top:0}
  .kv .pn{font-family:var(--mono);font-size:11px;color:var(--text)}
  .kv .ds{color:var(--muted);font-size:10px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:170px}
  .tag{font-size:9px;padding:1px 5px;border-radius:3px;border:1px solid;letter-spacing:.03em}
  .tag.req{color:#ffb4b4;border-color:#7a3b3b;background:#3a1f1f}
  .tag.opt{color:#9fd8ff;border-color:#2f5570;background:#16283a}
  .xbtn{background:transparent;border:0;color:var(--muted);cursor:pointer;font-size:12px;padding:0 3px}
  .xbtn:hover{color:var(--danger)}
  .catrow{display:flex;align-items:center;gap:6px;font-size:11px;padding:3px 0}
  .catrow input{margin:0}
  .catrow .nm{flex:1}
  .pintbl{width:100%;border-collapse:collapse;font-size:10px}
  .pintbl th{text-align:left;color:var(--muted);font-weight:500;padding:3px 4px;border-bottom:1px solid var(--border)}
  .pintbl td{padding:3px 4px;border-bottom:1px solid #ffffff0a;vertical-align:top}
  .pintbl td.pnum{font-family:var(--mono);color:var(--muted);white-space:nowrap}
  .pintbl .mini{padding:2px 5px;font-size:10px}
  .sect-body .fld{display:block;width:100%;text-align:left;margin-top:6px}
  .pintbl select{max-width:74px}
  .pintbl td:last-child{width:78px}
  .crimp-set{font-family:var(--mono);font-size:10px;color:var(--text);word-break:break-all}
  .crimp-none{color:var(--muted);font-size:10px}
  .badge-mate{fill:#1f2430;stroke:#7f8aa3;stroke-width:1.2}
  .badge-mate-pin{fill:#7f8aa3}
  .thumb-prev{width:64px;height:48px;border-radius:5px;background:#3a3a42;background-size:cover;
    background-position:center;border:1px solid #4a4a54;flex:none}

  #stage-wrap{position:relative;background:var(--canvas);overflow:hidden;cursor:grab}
  #stage-wrap.panning{cursor:grabbing}
  #stage{position:absolute;left:0;top:0;transform-origin:0 0}
  svg#canvas{display:block}
  .dotgrid{fill:var(--grid)}
  .band{fill:#ffffff05;stroke:#ffffff10}
  .band-t{fill:#5a5a68;font:600 13px var(--sans);letter-spacing:.14em;text-transform:uppercase}
  .comp-body{fill:var(--comp);stroke:var(--comp-bd);stroke-width:1.25}
  .comp.selected .comp-body{stroke:var(--sel);stroke-width:2}
  .comp.dimc{opacity:.2}
  .comp-hdr{fill:var(--hdr)}
  .comp-title{fill:var(--text);font:600 12px var(--sans)}
  .comp-id{fill:var(--muted);font:500 11px var(--mono)}
  .pin-num{fill:var(--muted);font:500 10px var(--mono)}
  .pin-name{fill:#d3d3da;font:400 11px var(--sans)}
  .handle{fill:var(--handle);stroke:#111;stroke-width:.6;pointer-events:none}
  /* Generous invisible grab target: the 4.5px dot alone was far too small to hit. */
  .handle-hit{fill:transparent;stroke:none;cursor:crosshair}
  .handle-hit:hover + .handle, .handle.hot{fill:var(--accent);r:6}
  .wire{fill:none;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round;pointer-events:none}
  .wire.selected{stroke-width:3.2;filter:drop-shadow(0 0 4px #fff8)}
  .wire.dim{opacity:.07}
  .wire.dash{stroke-dasharray:7 5}
  .wire-hit{fill:none;stroke:transparent;stroke-width:10;cursor:pointer}
  .rail{stroke-width:1.7;fill:none;stroke-linecap:round;pointer-events:none}
  .rail-t{font:600 9px var(--mono);pointer-events:none}
  .rail-hit{fill:transparent;stroke:none;cursor:pointer}
  .rail-g.selected .rail{stroke-width:3}
  .fixpt{fill:#16161a;stroke:var(--sel);stroke-width:1.6;cursor:move}
  .fixpt:hover{fill:var(--sel)}
  .endpt{fill:var(--warn);stroke:#111;stroke-width:1;cursor:grab}
  .splice{fill:#2a2a30;stroke:#9aa}
  .note-bg{fill:#1b1912;stroke:#5f5326}
  .note-tx{fill:#e2cf88;font:400 11px var(--sans)}
  .badge{font:700 9px var(--sans);letter-spacing:.04em}
  /* Halo the label so crossing wires read behind it instead of through it. */
  .wlabel{font:600 11px var(--mono);cursor:move;
    paint-order:stroke;stroke:var(--canvas);stroke-width:3.5px;stroke-linejoin:round}
  .wlabel.selected{stroke:#000;fill:#fff}
  /* Big mirrored component names that appear when zoomed out past the read threshold. */
  .zlabel{font-family:var(--sans);font-weight:700;fill:#e8e8f0;pointer-events:none;
    paint-order:stroke;stroke:#0b0b0dcc;stroke-linejoin:round}
  footer{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:0 10px;background:var(--panel);border-top:1px solid var(--border);font-size:12px;color:var(--muted)}
  footer label{display:flex;align-items:center;gap:5px;cursor:pointer;user-select:none;white-space:nowrap}
  footer .sp{flex:1}
  #ctx{position:fixed;z-index:20;background:#16161a;border:1px solid var(--border);border-radius:8px;padding:6px;min-width:200px;display:none;box-shadow:0 12px 40px #0008}
  #ctx button{display:block;width:100%;text-align:left;background:transparent;border:0;color:var(--text);padding:7px 10px;border-radius:5px;font:inherit;font-size:12px;cursor:pointer}
  #ctx button:hover{background:#2a2a32}
  #ctx .sep{height:1px;background:var(--border);margin:4px 0}
  .insp-row{display:grid;grid-template-columns:72px 1fr;gap:6px;margin:0 0 8px;font-size:12px;align-items:center}
  .insp-row input, .insp-row select, textarea{
    width:100%;background:var(--bg);color:var(--text);border:1px solid var(--border);border-radius:5px;padding:5px 7px;font:inherit;font-size:12px
  }
  textarea{min-height:70px;resize:vertical}
  .hint{font-size:11px;color:var(--muted);line-height:1.5}
  .status-ok{color:var(--accent)} .status-prop{color:var(--warn)} .status-tbd{color:var(--muted)}
  .legend-dot{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:6px;vertical-align:middle}
  #layout-empty{display:none;position:absolute;inset:0;align-items:center;justify-content:center;color:var(--muted);font-size:14px;padding:40px;text-align:center}
  #app.layout #stage-wrap svg{opacity:.35;pointer-events:none}
  #app.layout #layout-empty{display:flex}
  #focus-bar{position:absolute;left:50%;transform:translateX(-50%);top:12px;display:none;align-items:center;gap:10px;
    background:#16161ae6;border:1px solid var(--sel);border-radius:8px;padding:6px 12px;font-size:12px;backdrop-filter:blur(4px)}
  #focus-bar.on{display:flex}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="logo"><span class="logo-mark"><i></i><i></i><i></i></span> ST185 harness</div>
    <button class="tool on" id="btn-schematic">Schematic</button>
    <button class="tool" id="btn-layout">Layout</button>
    <span class="sp"></span>
    <label class="hint" style="display:flex;align-items:center;gap:5px">Spacing
      <select class="tool" id="sel-spread">
        <option value="1">100%</option>
        <option value="1.25">125%</option>
        <option value="1.5" selected>150%</option>
        <option value="1.85">185%</option>
        <option value="2.3">230%</option>
      </select>
    </label>
    <button class="tool" id="btn-wide">Wide canvas</button>
    <button class="tool" id="btn-fit">Fit width</button>
    <button class="tool" id="btn-fitall">Fit all</button>
    <button class="tool" id="btn-export">JSON</button>
    <button class="tool" id="btn-svg">SVG</button>
    <button class="tool" id="btn-reset">Reset ST185</button>
  </header>

  <aside>
    <div class="aside-h">Layers <span class="sp"></span>
      <button class="solo mini" id="btn-all" style="opacity:1;padding:2px 6px">all</button>
    </div>
    <div id="layers"></div>

    <div class="aside-h">Component library <span class="sp"></span><span class="ct" id="lib-count"></span></div>
    <input id="lib-search" type="text" placeholder="Search part no, model or description">
    <div class="row-btns">
      <button class="mini" id="lib-add">+ Add component</button>
      <button class="mini" id="lib-find">Find more…</button>
    </div>
    <label style="display:flex;gap:6px;align-items:center;font-size:11px;color:var(--muted);margin-bottom:8px">
      <input type="checkbox" id="lib-mate"> Show mating connector
    </label>
    <div id="lib-list"></div>

    <div class="aside-h">Nets</div>
    <div class="hint" id="net-legend"></div>
  </aside>

  <div id="stage-wrap">
    <div id="stage"><svg id="canvas" xmlns="http://www.w3.org/2000/svg"></svg></div>
    <div id="focus-bar"><span id="focus-lbl"></span><button class="mini" id="btn-unfocus">Clear focus</button></div>
    <div id="layout-empty">Layout view is a placeholder. Physical bundle routing is not defined yet — stay in Schematic. When bundle lengths exist, this view can show the nailboard.</div>
  </div>

  <aside id="inspector">
    <div class="aside-h">Inspector</div>
    <div id="insp" class="hint"></div>
  </aside>

  <footer>
    <button id="btn-zoom-out">−</button>
    <span id="zoom-lbl">100%</span>
    <button id="btn-zoom-in">+</button>
    <label><input type="checkbox" id="tog-rails" checked> Power as symbols</label>
    <label><input type="checkbox" id="tog-focus" checked> Focus on click</label>
    <label><input type="checkbox" id="tog-labels"> Wire labels</label>
    <label><input type="checkbox" id="tog-ids" checked> IDs</label>
    <label><input type="checkbox" id="tog-dash" checked> Dash proposed</label>
    <span class="sp"></span>
    <span>Pan drag · Zoom wheel · Wire: pin → pin · Delete <span class="kbd">Del</span></span>
    <span id="stat"></span>
  </footer>
</div>
<div id="ctx"></div>
<div id="modal-bg"><div class="modal" id="modal"></div></div>
<script>
const PIN_H = 20, HDR = 32, PAD = 8, COMP_W = 196;
const WORLD = 400000;         // half-extent of the unbounded grid surface
const STORAGE = "st185-harness-v7";
const ZOOM_LABEL_AT = 0.70;   // zoom at or below which the big names appear
const ZOOM_LABEL_SCALE = 2.5; // how much larger those names are than the in-block title   // below this, mirror each component name in a big label
const NET_COLORS = {
  CANH:"#f2f2f2", CANL:"#3dd68c", "12V":"#e85d5d", "5V":"#f08a2a", "3V3":"#f5c542",
  GND:"#8b8b96", SIG:"#5b8def", UART:"#8b5cf6", INJ:"#3b82f6", IGN:"#f97316",
  AUX:"#a78bfa", TEMP:"#84cc16", TRIG:"#14b8a6", DI:"#38bdf8"
};

/* Functional layers. Toggling one hides its parts and every wire touching them. */
const GROUPS = {
  ecu:     { name:"ECU — XtremeX A/B", color:"#5b8def" },
  engine:  { name:"Engine sensors",     color:"#84cc16" },
  fuel:    { name:"Injection & ignition", color:"#f97316" },
  dbw:     { name:"Drive-by-wire",      color:"#a78bfa" },
  power:   { name:"Power & relays",     color:"#e85d5d" },
  can:     { name:"CAN bus",            color:"#3dd68c" },
  cluster: { name:"Clusters & HMI",     color:"#8b5cf6" },
  body:    { name:"Body & switchboard", color:"#38bdf8" },
  prop:    { name:"Proposed / TBD",     color:"#e8b849" },
  notes:   { name:"Notes & callouts",   color:"#a9924a" },
  misc:    { name:"Unsorted",           color:"#9aa0aa" }
};
const GROUP_OF = {
  "ecu-a":"ecu","ecu-b":"ecu","ecu-com":"ecu",
  crank:"engine",cam:"engine",ect:"engine",iat:"engine","oil-t":"engine","cp-iat":"engine",
  knock:"engine","turbo-spd":"engine",flex:"engine",map:"engine","oil-p":"engine",
  "fuel-p":"engine","clnt-p":"engine",
  inj1:"fuel",inj2:"fuel",inj3:"fuel",inj4:"fuel",
  cop1:"fuel",cop2:"fuel",cop3:"fuel",cop4:"fuel",boost:"fuel",
  etb:"dbw",aps:"dbw",
  batt:"power",buck:"power","sp-12v":"power","sp-gnd":"power","sp-5v":"power",
  "k-efi":"power","k-etb":"power","k-fp":"power","k-fan":"power","k-str":"power",
  "ac-rly":"power",mrs:"power",
  xcvr:"can",csb3:"can",lambda:"can",usbcan:"can",pi:"can",r120a:"can",r120b:"can",
  "sp-canh":"can","sp-canl":"can",
  center:"cluster",left:"cluster",right:"cluster",btn:"cluster",enc1:"cluster",enc2:"cluster",
  cabin:"body",brake:"body",rev:"body",cruise:"body","c-main":"body","ac-req":"body",evap:"body",
  "fuel-lvl":"prop","r-fuel":"prop","abs-fl":"prop","abs-fr":"prop","abs-rl":"prop","abs-rr":"prop",
  "start-sw":"prop",clutch:"prop","k-fan2":"prop",fan2:"prop","oil-lamp":"prop",pmu:"prop",
  hat:"prop",knock2:"prop"
};
/* Splices that behave as global rails. Wires to these draw as a power/ground symbol. */
const RAILS = { "sp-12v":"12V", "sp-gnd":"GND", "sp-5v":"5V" };

/* Background bands, in seed coordinates (scaled by spacing). */
const BANDS = [
  { x:20,  y:-40,  w:2320, h:1760, label:"Engine management — sensors in · ECU · actuators out" },
  { x:20,  y:1740, w:2320, h:820,  label:"CAN bus 1 Mbit/s · clusters · RealDash" },
  { x:20,  y:2580, w:2320, h:300,  label:"Body & switchboard — waiting on CSB3 connector" }
];

const $ = (s) => document.querySelector(s);
let state = {
  components: [], wires: [], view:{x:40,y:30,k:0.5}, sel:null, focus:null,
  spread: 1.5, hidden: {}
};
let ui = { pan:null, drag:null, wire:null };

function uid(p){ return p + "-" + Math.random().toString(36).slice(2,8); }
function pinH(c){ return HDR + (c.pins?.length || 1) * PIN_H + PAD; }
function compH(c){
  if (c.kind === "note") return c.h || 92;
  if (c.kind === "splice") return 20;
  return pinH(c);
}
/* Effective position: spacing multiplier moves blocks apart without resizing them. */
function ex(c){ return c.x * state.spread; }
function ey(c){ return c.y * state.spread; }
function pinY(c, i){ return ey(c) + HDR + 10 + i * PIN_H; }
function pinXY(c, pin){
  /* A splice is a junction, not a directional pin. Reporting it as "right" made every
     wire shoot 26px past it and double back (the fold/overshoot in the bug reports). */
  if (c.kind === "splice") return { x: ex(c) + 10, y: ey(c) + 10, side:"omni" };
  const i = c.pins.findIndex(p => p.id === pin.id);
  const left = pin.side !== "right";
  return { x: left ? ex(c) : ex(c) + (c.w || COMP_W), y: pinY(c, i), side: left ? "left" : "right" };
}
/* Clickable bounds. A splice's label sits outside its 24px box, so include it. */
function hitBox(c){
  if (c.kind === "splice"){
    const wLbl = 26 + (c.name || "").length * 6.2;
    return { x: ex(c) - 4, y: ey(c) - 2, w: Math.max(c.w || 24, wLbl), h: compH(c) + 4 };
  }
  return { x: ex(c), y: ey(c), w: c.w || COMP_W, h: compH(c) };
}

function mkPins(names, side){
  return names.map((name, i) => ({ id:"p"+(i+1), num:String(i+1), name, side }));
}
function loomPins(prefix, defs, defaultSide){
  return defs.map(([n, name, side]) => ({
    id:"p"+n, num:prefix+n, name, side: side || defaultSide || "left"
  }));
}
function comp(id, name, ident, x, y, names, side, extra={}){
  return {
    id, kind: extra.kind || "connector", name, ident, x, y, w: extra.w || COMP_W,
    pins: extra.pins || mkPins(names, side),
    status: extra.status || "ok",
    note: extra.note || "",
    unwired: !!extra.unwired
  };
}

function findC(id){ return state.components.find(c => c.id === id); }
function findPin(c, pid){ return c.pins.find(p => p.id === pid); }
function groupOf(c){ return c.group || GROUP_OF[c.id] || (c.kind === "note" ? "notes" : "misc"); }
function visible(c){ return !state.hidden[groupOf(c)]; }

/* A wire is a rail stub when one end lands on a global power/ground splice. */
function railEnd(w){
  if (!state.rails) return null;
  if (RAILS[w.from.c]) return { net: RAILS[w.from.c], at: w.to };
  if (RAILS[w.to.c])   return { net: RAILS[w.to.c],   at: w.from };
  return null;
}

/* ---- Orthogonal routing ----
   Rules that came out of the reported routing bugs:
   - "omni" ends (splices) get no exit stub, so a wire never overshoots past the junction.
   - The vertical channel is clamped between the two exit points, so a wire never folds
     back across the pin it just left.
   - When the target sits behind a directional pin, run a horizontal corridor (an S)
     instead of doubling back over the stub. */
const EXT = 24;
function dirOf(side){ return side === "left" ? -1 : side === "right" ? 1 : 0; }
function clampTo(v, a, b){ return Math.max(Math.min(a,b), Math.min(Math.max(a,b), v)); }

function routePoints(A, B, lane){
  const aD = dirOf(A.side), bD = dirOf(B.side);
  const ax = A.x + aD * EXT, bx = B.x + bD * EXT;
  const pts = [[A.x, A.y]];
  if (aD) pts.push([ax, A.y]);

  if (Math.abs(A.y - B.y) < 1.2){
    if (bD) pts.push([bx, B.y]);
    pts.push([B.x, B.y]);
    return pts;
  }
  const blockedA = aD !== 0 && (bx - ax) * aD < 0;
  const blockedB = bD !== 0 && (ax - bx) * bD < 0;
  if (!blockedA && !blockedB){
    pts.push([clampTo((ax + bx) / 2 + lane, ax, bx), A.y]);
    pts.push([clampTo((ax + bx) / 2 + lane, ax, bx), B.y]);
  } else {
    const midY = (A.y + B.y) / 2 + lane;
    pts.push([ax, midY], [bx, midY]);
  }
  if (bD) pts.push([bx, B.y]);
  pts.push([B.x, B.y]);
  return pts;
}

/* Route through pinned waypoints. Each leg stays orthogonal and the fix points hold
   their world position when an endpoint later moves, so nothing detaches. */
function wirePoints(A, B, lane, fixes){
  if (!fixes || !fixes.length) return routePoints(A, B, lane);
  const aD = dirOf(A.side), bD = dirOf(B.side);
  const pts = [[A.x, A.y]];
  if (aD) pts.push([A.x + aD * EXT, A.y]);
  let cur = pts[pts.length - 1];
  fixes.forEach(f => { pts.push([f.x, cur[1]], [f.x, f.y]); cur = [f.x, f.y]; });
  const bx = B.x + bD * EXT;
  pts.push([bx, cur[1]]);
  if (bD) pts.push([bx, B.y]);
  pts.push([B.x, B.y]);
  return pts;
}
function orthPath(A, B, lane, fixes){ return roundPath(wirePoints(A, B, lane, fixes), 9); }
function roundPath(raw, r){
  const pts = [];
  raw.forEach(p => {
    const last = pts[pts.length-1];
    if (!last || Math.abs(last[0]-p[0]) > 0.5 || Math.abs(last[1]-p[1]) > 0.5) pts.push(p);
  });
  if (pts.length < 2) return "";
  let d = `M${pts[0][0]},${pts[0][1]}`;
  for (let i=1;i<pts.length-1;i++){
    const p = pts[i-1], c = pts[i], n = pts[i+1];
    const d1 = Math.hypot(c[0]-p[0], c[1]-p[1]);
    const d2 = Math.hypot(n[0]-c[0], n[1]-c[1]);
    const rr = Math.min(r, d1/2, d2/2);
    if (rr < 1){ d += ` L${c[0]},${c[1]}`; continue; }
    const u1 = [(p[0]-c[0])/d1, (p[1]-c[1])/d1];
    const u2 = [(n[0]-c[0])/d2, (n[1]-c[1])/d2];
    d += ` L${c[0]+u1[0]*rr},${c[1]+u1[1]*rr}`;
    d += ` Q${c[0]},${c[1]} ${c[0]+u2[0]*rr},${c[1]+u2[1]*rr}`;
  }
  const e = pts[pts.length-1];
  return d + ` L${e[0]},${e[1]}`;
}

/* Spread wires that share a vertical channel into parallel lanes so they never overlap. */
function assignLanes(items){
  const buckets = {};
  items.forEach(it => {
    const key = Math.round(((it.A.x + it.B.x) / 2) / 60);
    (buckets[key] = buckets[key] || []).push(it);
  });
  Object.values(buckets).forEach(list => {
    list.sort((p,q) => (p.A.y + p.B.y) - (q.A.y + q.B.y));
    list.forEach((it, i) => { it.lane = (i - (list.length - 1) / 2) * 9; });
  });
}

function connectedTo(id){
  const set = new Set([id]);
  state.wires.forEach(w => {
    if (w.from.c === id) set.add(w.to.c);
    if (w.to.c === id) set.add(w.from.c);
  });
  return set;
}

const NS = "http://www.w3.org/2000/svg";
function el(tag, attrs={}){
  const n = document.createElementNS(NS, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  return n;
}

function render(){
  const svg = $("#canvas");
  state.rails  = $("#tog-rails").checked;
  const showIds    = $("#tog-ids").checked;
  const dashInc    = $("#tog-dash").checked;
  const showLabels = $("#tog-labels").checked;

  const shown = state.components.filter(visible);
  const railHidden = c => state.rails && RAILS[c.id];
  const drawn = shown.filter(c => !railHidden(c));

  const bandsShown = BANDS.filter(b => drawn.some(c => c.y >= b.y && c.y <= b.y + b.h));
  svg.innerHTML = "";

  const defs = el("defs");
  defs.innerHTML = `<pattern id="dots" width="26" height="26" patternUnits="userSpaceOnUse">
    <circle class="dotgrid" cx="1" cy="1" r="1"/></pattern>`;
  svg.appendChild(defs);
  /* The workspace has no sheet edge. The grid is one huge tiled rect so it keeps
     rendering however far the user pans, in any direction including negative. */
  svg.appendChild(el("rect", { x:-WORLD, y:-WORLD, width:WORLD*2, height:WORLD*2, fill:"url(#dots)" }));

  /* Background bands give the eye a place to rest and name each zone.
     A band with nothing visible in it is dropped so isolated layers sit alone. */
  const gB = el("g");
  bandsShown.forEach(b => {
    gB.appendChild(el("rect", {
      class:"band", x:b.x*state.spread, y:b.y*state.spread,
      width:b.w*state.spread, height:b.h*state.spread, rx:18
    }));
    const t = el("text", { class:"band-t", x:b.x*state.spread + 22, y:b.y*state.spread + 30 });
    t.textContent = b.label;
    gB.appendChild(t);
  });
  svg.appendChild(gB);

  const focusSet = state.focus ? connectedTo(state.focus) : null;

  /* ---- collect wires + rail stubs ---- */
  const vis = new Set(shown.map(c => c.id));
  const routed = [];
  const rails = [];
  state.wires.forEach(w => {
    const a = findC(w.from.c), b = findC(w.to.c);
    if (!a || !b || !vis.has(a.id) || !vis.has(b.id)) return;
    const pa = findPin(a, w.from.p), pb = findPin(b, w.to.p);
    if (!pa || !pb) return;

    const re = railEnd(w);
    if (re){
      const host = findC(re.at.c);
      const hp = findPin(host, re.at.p);
      if (!host || !hp) return;
      rails.push({ w, net:re.net, at: pinXY(host, hp), host: host.id });
      return;
    }
    routed.push({ w, A: pinXY(a, pa), B: pinXY(b, pb), lane: 0 });
  });
  assignLanes(routed);

  const gW = el("g");
  const gOverlay = el("g");          // fix points / endpoint grips for the selected wire
  routed.forEach(it => {
    const { w, A, B } = it;
    const dim = focusSet && !(focusSet.has(w.from.c) && focusSet.has(w.to.c));
    const pts = wirePoints(A, B, it.lane, w.fixes);
    const d = roundPath(pts, 9);
    it.pts = pts;
    const hit = el("path", { class:"wire-hit", d });
    hit.dataset.id = w.id;
    gW.appendChild(hit);
    const path = el("path", {
      class: "wire" + (state.sel===w.id ? " selected" : "") + (dim ? " dim" : "") + ((dashInc && w.dashed) ? " dash" : ""),
      d, stroke: w.color || "#888"
    });
    path.dataset.id = w.id;
    gW.appendChild(path);

    if ((showLabels || state.sel === w.id) && w.label && !dim){
      const mid = pts[Math.floor(pts.length/2)] || [ (A.x+B.x)/2, (A.y+B.y)/2 ];
      const off = w.labelOff || { x:0, y:-7 };
      const t = el("text", {
        class:"wlabel" + (state.sel===w.id ? " selected" : ""),
        x: mid[0] + off.x, y: mid[1] + off.y,
        fill:w.color || "#aaa", "text-anchor":"middle"
      });
      t.textContent = w.label;
      t.dataset.labelFor = w.id;
      gW.appendChild(t);
    }

    if (state.sel === w.id){
      (w.fixes || []).forEach((f, i) => {
        const k = el("rect", { class:"fixpt", x:f.x-5, y:f.y-5, width:10, height:10, rx:2 });
        k.dataset.fix = w.id; k.dataset.fixIdx = i;
        gOverlay.appendChild(k);
      });
      [["from", A], ["to", B]].forEach(([end, P]) => {
        const e = el("circle", { class:"endpt", cx:P.x, cy:P.y, r:5.5 });
        e.dataset.endWire = w.id; e.dataset.end = end;
        gOverlay.appendChild(e);
      });
    }
  });
  /* Rail symbols: GND points down, supplies point up — the standard schematic cue. */
  rails.forEach(r => {
    const dim = focusSet && !focusSet.has(r.host);
    const dir = r.at.side === "left" ? -1 : 1;
    const col = NET_COLORS[r.net] || "#888";
    const g = el("g", { class:"rail-g" + (state.sel===r.w.id ? " selected" : ""), opacity: dim ? 0.07 : 1 });
    const ro = r.w.railOff || { x:0, y:0 };
    const x0 = r.at.x, y0 = r.at.y, x1 = r.at.x + dir*17 + ro.x, y1 = y0 + ro.y;
    g.appendChild(el("path", { class:"rail", d:`M${x0},${y0} L${x1},${y1}`, stroke:col }));
    if (r.net === "GND"){
      g.appendChild(el("path", { class:"rail", d:`M${x1},${y1-5} L${x1},${y1+5}`, stroke:col }));
      g.appendChild(el("path", { class:"rail", d:`M${x1+dir*3},${y1-3} L${x1+dir*3},${y1+3}`, stroke:col }));
      g.appendChild(el("path", { class:"rail", d:`M${x1+dir*6},${y1-1.5} L${x1+dir*6},${y1+1.5}`, stroke:col }));
    } else {
      g.appendChild(el("path", { class:"rail", d:`M${x1},${y1-5} L${x1},${y1+5}`, stroke:col }));
      const t = el("text", { class:"rail-t", x:x1 + dir*4, y:y1 - 7, fill:col, "text-anchor": dir>0 ? "start" : "end" });
      t.textContent = r.net;
      g.appendChild(t);
    }
    /* Grab target so the rail tap can be selected and dragged like any other element. */
    const rh = el("rect", { class:"rail-hit", x:Math.min(x0,x1)-6, y:y1-12, width:Math.abs(x1-x0)+18, height:24 });
    rh.dataset.rail = r.w.id;
    g.appendChild(rh);
    gW.appendChild(g);
  });
  svg.appendChild(gW);

  /* Which side does each part's wiring leave from? The mate badge goes on the other. */
  const wireSides = {};
  const bumpSide = (cid, side) => {
    const s = wireSides[cid] || (wireSides[cid] = { left:0, right:0 });
    if (side === "left") s.left++; else if (side === "right") s.right++;
  };
  routed.forEach(it => { bumpSide(it.w.from.c, it.A.side); bumpSide(it.w.to.c, it.B.side); });
  rails.forEach(r => bumpSide(r.host, r.at.side));

  /* ---- components on top, so wires read as passing behind them ---- */
  const gC = el("g");
  drawn.forEach(c => {
    const g = el("g", { class: "comp" + (state.sel===c.id ? " selected" : "") + (focusSet && !focusSet.has(c.id) ? " dimc" : "") });
    g.dataset.id = c.id;
    const w = c.w || COMP_W, h = compH(c), X = ex(c), Y = ey(c);

    if (c.kind === "note"){
      g.appendChild(el("rect", { class:"note-bg", x:X, y:Y, width:w, height:h, rx:8 }));
      const t = el("text", { class:"note-tx", x:X+12, y:Y+20, style:"font-weight:600" });
      t.textContent = c.name;
      g.appendChild(t);
      wrapText(g, c.note || "", X+12, Y+38, w-24);
      gC.appendChild(g); return;
    }

    if (c.kind === "splice"){
      g.appendChild(el("circle", { class:"splice", cx:X+10, cy:Y+10, r:8 }));
      const hdl = el("circle", { class:"handle", cx:X+10, cy:Y+10, r:4.5 });
      g.appendChild(hdl);
      const hh = el("circle", { class:"handle-hit", cx:X+10, cy:Y+10, r:9 });
      hh.dataset.cid = c.id; hh.dataset.pid = (c.pins[0] && c.pins[0].id) || "p1";
      g.appendChild(hh);
      const lb = el("text", { class:"pin-name", x:X+24, y:Y+14, "pointer-events":"none" });
      lb.textContent = c.name;
      g.appendChild(lb);
      gC.appendChild(g); return;
    }

    g.appendChild(el("rect", { class:"comp-body", x:X, y:Y, width:w, height:h, rx:8 }));
    g.appendChild(el("rect", { class:"comp-hdr", x:X, y:Y, width:w, height:HDR, rx:8 }));
    g.appendChild(el("rect", { x:X, y:Y+20, width:w, height:12, fill:"var(--hdr)" }));
    /* group colour tab down the left edge */
    const gc = GROUPS[groupOf(c)];
    if (gc) g.appendChild(el("rect", { x:X, y:Y+6, width:3, height:h-12, fill:gc.color, opacity:.85, rx:1.5 }));

    const title = el("text", { class:"comp-title", x:X+12, y:Y+20 });
    title.textContent = c.name;
    g.appendChild(title);
    if (showIds && c.ident){
      const idt = el("text", { class:"comp-id", x:X+w-8, y:Y+20, "text-anchor":"end" });
      idt.textContent = c.ident;
      g.appendChild(idt);
    }
    if (c.unwired){
      const b = el("text", { class:"badge", fill:"#e8b849", x:X+12, y:Y+h-6 });
      b.textContent = "NO CONNECTOR YET";
      g.appendChild(b);
    }

    (c.pins||[]).forEach((p,i) => {
      const y = pinY(c,i), left = p.side !== "right";
      const num = el("text", { class:"pin-num", x: left ? X+12 : X+w-12, y:y+4, "text-anchor": left ? "start" : "end", "pointer-events":"none" });
      num.textContent = p.num;
      g.appendChild(num);
      const nm = el("text", { class:"pin-name", x: left ? X+44 : X+w-44, y:y+4, "text-anchor": left ? "start" : "end", "pointer-events":"none" });
      nm.textContent = p.name;
      g.appendChild(nm);
      const hdl = el("circle", { class:"handle", cx: left ? X : X+w, cy:y, r:4.5 });
      g.appendChild(hdl);
      const hh = el("circle", { class:"handle-hit", cx: left ? X : X+w, cy:y, r:11 });
      hh.dataset.cid = c.id; hh.dataset.pid = p.id;
      g.appendChild(hh);
    });

    /* The only new canvas element in this phase: a small generic connector icon
       marking that this part has a mating half recorded in the Inspector. */
    if ((c.mates||[]).length) drawMateBadge(g, c, X, Y, w, h, wireSides);
    gC.appendChild(g);
  });
  svg.appendChild(gC);
  svg.appendChild(gOverlay);

  /* Below the read threshold the in-block text is unreadable, so mirror each
     component name in a much larger label floating above its block. */
  if (state.view.k < ZOOM_LABEL_AT){
    const gZ = el("g");
    const size = 12 * ZOOM_LABEL_SCALE;      // 2.5x the in-block title
    const placed = [];
    drawn.filter(c => c.kind !== "note" && c.name).forEach(c => {
      const X = ex(c), w = c.w || COMP_W;
      let y = ey(c) - size * 0.35;
      // nudge up while this label would sit on one already placed nearby
      for (let guard = 0; guard < 6; guard++){
        const clash = placed.some(q => Math.abs(q.y - y) < size * 0.95 &&
                                       Math.abs(q.x - (X + w/2)) < (q.w + w) / 2 + 40);
        if (!clash) break;
        y -= size * 1.0;
      }
      placed.push({ x:X + w/2, y, w: Math.max(w, c.name.length * size * 0.5) });
      const t = el("text", {
        class:"zlabel", x:X + w/2, y, "text-anchor":"middle",
        style:`font-size:${size}px;stroke-width:${(size*0.18).toFixed(1)}px`
      });
      t.textContent = c.name;
      gZ.appendChild(t);
    });
    svg.appendChild(gZ);
  }

  applyView();
  const hiddenCount = state.components.length - shown.length;
  $("#stat").textContent = `${drawn.length} shown · ${routed.length} wires · ${rails.length} rail taps`
    + (hiddenCount ? ` · ${hiddenCount} hidden` : "");
  $("#zoom-lbl").textContent = Math.round(state.view.k*100) + "%";
  const fb = $("#focus-bar");
  if (state.focus){
    const c = findC(state.focus);
    fb.classList.add("on");
    $("#focus-lbl").textContent = "Focused on " + (c ? c.name : state.focus);
  } else fb.classList.remove("on");
  renderLayers();
  renderLegend();
  persist();
}


/* Mating-connector badge. Sits opposite the wiring, nudged clear of neighbours, and
   never further than 0.7x its own width from the block edge. */
const MATE_BADGE_W = 22, MATE_BADGE_H = 16;
function drawMateBadge(g, c, X, Y, w, h, wireSides){
  const s = wireSides[c.id] || { left:0, right:0 };
  const onRight = s.right <= s.left;                 // opposite the busier side
  const gap = MATE_BADGE_W * 0.7;                    // hard cap from the spec
  const bx = onRight ? X + w + gap - MATE_BADGE_W/2 : X - gap - MATE_BADGE_W/2;
  let by = Y + Math.min(h / 2, HDR + 6) - MATE_BADGE_H/2;

  // nudge vertically off any neighbouring block that already occupies that spot
  for (let n = 0; n < 5; n++){
    const clash = state.components.some(o => {
      if (o === c || !visible(o) || (state.rails && RAILS[o.id])) return false;
      const ob = hitBox(o);
      return bx + MATE_BADGE_W > ob.x && bx < ob.x + ob.w &&
             by + MATE_BADGE_H > ob.y && by < ob.y + ob.h;
    });
    if (!clash) break;
    by -= MATE_BADGE_H + 4;
  }
  const bg = el("g", { class:"mate-badge" });
  bg.appendChild(el("rect", { class:"badge-mate", x:bx, y:by,
    width:MATE_BADGE_W, height:MATE_BADGE_H, rx:3 }));
  for (let i = 0; i < 3; i++){
    bg.appendChild(el("circle", { class:"badge-mate-pin",
      cx:bx + 6 + i*5, cy:by + MATE_BADGE_H/2, r:1.6 }));
  }
  const ttl = el("title");
  ttl.textContent = "Mates: " + (c.mates||[]).map(m => m.pn).filter(Boolean).join(", ");
  bg.appendChild(ttl);
  g.appendChild(bg);
}

function wrapText(g, text, x, y, maxW){
  const words = String(text||"").split(" ");
  const perLine = Math.max(18, Math.floor(maxW / 5.4));
  let line = "", ly = y;
  const flush = () => {
    const t = el("text", { class:"note-tx", x, y:ly, "font-size":"10" });
    t.textContent = line;
    g.appendChild(t); ly += 13;
  };
  words.forEach(wd => {
    const test = line ? line+" "+wd : wd;
    if (test.length > perLine){ flush(); line = wd; } else line = test;
  });
  if (line) flush();
}

/* World->screen stays `screen = view.x + world*k`; expressing that as a viewBox means
   pan/zoom/fit math is unchanged but the drawing surface has no edge. */
function applyView(){
  const svg = $("#canvas"), r = $("#stage-wrap").getBoundingClientRect();
  const k = state.view.k;
  svg.setAttribute("width", Math.max(1, Math.round(r.width)));
  svg.setAttribute("height", Math.max(1, Math.round(r.height)));
  svg.setAttribute("viewBox",
    `${-state.view.x/k} ${-state.view.y/k} ${Math.max(1, r.width/k)} ${Math.max(1, r.height/k)}`);
}
function persist(){
  try{
    localStorage.setItem(STORAGE, JSON.stringify({
      components:state.components, wires:state.wires, view:state.view,
      spread:state.spread, hidden:state.hidden
    }));
  }catch(e){}
}
function load(){
  try{
    const d = JSON.parse(localStorage.getItem(STORAGE) || "null");
    if (d && d.components?.length){
      state.components = d.components;
      state.wires = d.wires || [];
      if (d.view) state.view = d.view;
      if (d.spread) state.spread = d.spread;
      if (d.hidden) state.hidden = d.hidden;
      return true;
    }
  }catch(e){}
  return false;
}

function renderLayers(){
  const counts = {};
  state.components.forEach(c => { const gk = groupOf(c); counts[gk] = (counts[gk]||0)+1; });
  const box = $("#layers");
  box.innerHTML = Object.entries(GROUPS).filter(([k]) => counts[k]).map(([k,g]) => `
    <div class="layer${state.hidden[k] ? " off" : ""}">
      <input type="checkbox" data-layer="${k}" ${state.hidden[k] ? "" : "checked"}>
      <span class="sw" style="background:${g.color}"></span>
      <span class="nm">${g.name}</span>
      <span class="ct">${counts[k]}</span>
      <button class="solo" data-solo="${k}">only</button>
    </div>`).join("");
  box.querySelectorAll("input[data-layer]").forEach(inp => {
    inp.onchange = () => { state.hidden[inp.dataset.layer] = !inp.checked; render(); };
  });
  box.querySelectorAll("button[data-solo]").forEach(b => {
    b.onclick = () => {
      const only = b.dataset.solo;
      Object.keys(GROUPS).forEach(k => { state.hidden[k] = (k !== only); });
      render();
    };
  });
}

function renderLegend(){
  const nets = {};
  state.wires.forEach(w => { if (w.net) nets[w.net] = w.color; });
  $("#net-legend").innerHTML = Object.entries(nets).map(([n,c]) =>
    `<div style="margin:3px 0"><span class="legend-dot" style="background:${c}"></span> ${n}</div>`
  ).join("");
}

      <div class="insp-row"><span>Label</span><input id="i-lab" value="${esc(w.label||"")}"></div>
      <div class="insp-row"><span>Color</span><input id="i-col" type="color" value="${toHex(w.color)}"></div>

      <button class="tool" id="i-clearfix">Clear fix points</button>

/* ---------- Inspector detail: mates, accessories, per-pin crimp, notes ----------
   These live in the Inspector only. The single thing this adds to the canvas is a
   small mating-connector badge, drawn in render(). */
function renderDetail(c){
  const box = $("#i-detail"); if (!box) return;
  const mates = c.mates = c.mates || [];
  const acc = accOf(c);
  const crimp = c.crimp = c.crimp || {};
  const isConnector = c.kind !== "note" && (c.pins||[]).length > 0;
  const activeCats = ACC_CATS.filter(k => catOn(c, k.key));
  const accCount = activeCats.reduce((n,k) => n + (acc[k.key]?.items?.length || 0), 0);
  const crimped = Object.keys(crimp).filter(k => crimp[k] && crimp[k].pn).length;

  box.innerHTML = `
  <details class="sect" id="s-mates">
    <summary>Compatible mates <span class="ct">${mates.length}</span></summary>
    <div class="sect-body">
      ${mates.length ? mates.map((m,i) => `
        <div class="kv">
          <div><span class="pn">${esc(m.pn||"(no PN)")}</span>
               <span class="ds">${esc([m.mfr,m.note].filter(Boolean).join(" · "))}</span></div>
          <button class="xbtn" data-rmmate="${i}" title="Remove">&times;</button>
        </div>`).join("")
        : `<p class="hint">No mating connector recorded yet.</p>`}
      <input class="mini fld" id="m-pn-new"   placeholder="Mate part no">
      <input class="mini fld" id="m-mfr-new"  placeholder="Manufacturer">
      <input class="mini fld" id="m-note-new" placeholder="Note (optional)">
      <button class="mini" id="m-add-mate" style="margin-top:6px">Add mate</button>
    </div>
  </details>

  <details class="sect" id="s-acc">
    <summary>Accessories <span class="ct">${accCount}</span></summary>
    <div class="sect-body">
      <p class="hint" style="margin:0 0 6px">Tick the categories that apply to this part.
         The choice is remembered on the library entry.</p>
      ${ACC_CATS.map(k => `
        <label class="catrow">
          <input type="checkbox" data-cat="${k.key}" ${catOn(c,k.key)?"checked":""}>
          <span class="nm">${esc(k.name)}</span>
          <span class="ct">${acc[k.key]?.items?.length || 0}</span>
        </label>`).join("")}
      ${activeCats.map(k => `
        <div style="margin-top:10px">
          <div class="aside-h" style="margin:4px 0">${esc(k.name)}</div>
          ${(acc[k.key].items||[]).map((it,i) => `
            <div class="kv">
              <div><span class="pn">${esc(it.pn||"(no PN)")}</span>
                   <span class="ds">${esc(accSummary(it))}</span></div>
              <div style="display:flex;gap:4px;align-items:center">
                <span class="tag ${it.req==="required"?"req":"opt"}"
                      data-togreq="${k.key}:${i}" style="cursor:pointer"
                      title="Click to toggle">${it.req==="required"?"required":"optional"}</span>
                <button class="xbtn" data-rmacc="${k.key}:${i}">&times;</button>
              </div>
            </div>`).join("") || `<p class="hint">Nothing added.</p>`}
          <button class="mini" data-addacc="${k.key}" style="margin-top:5px">Add ${esc(k.name.split(" ")[0].toLowerCase())}</button>
        </div>`).join("")}
    </div>
  </details>

  ${isConnector ? `
  <details class="sect" id="s-crimp">
    <summary>Per-pin crimp <span class="ct">${crimped}/${c.pins.length}</span></summary>
    <div class="sect-body">
      <p class="hint" style="margin:0 0 6px">Pick a terminal family to fill every cavity
         (${c.pins.length}), then override any single pin.</p>
      <div style="display:flex;gap:6px">
        <select id="cr-family" style="flex:1"><option value="">Terminal family…</option>
          ${(acc.crimp?.items||[]).map((it,i) =>
            `<option value="${i}">${esc(it.pn||"(no PN)")} ${esc(it.awg?("· "+it.awg):"")}</option>`).join("")}
        </select>
        <button class="mini" id="cr-apply">Fill all</button>
        <button class="mini" id="cr-clear">Clear</button>
      </div>
      ${(acc.crimp?.items||[]).length ? "" :
        `<p class="hint" style="margin-top:6px">Add crimp terminals under
          <b>Accessories → Crimp terminals</b> first.</p>`}
      <table class="pintbl" style="margin-top:8px">
        <tr><th>Pin</th><th>Crimp</th><th></th></tr>
        ${c.pins.map(pn => {
          const t2 = crimp[pn.id];
          return `<tr>
            <td class="pnum">${esc(pn.num)}<br><span class="ds">${esc(pn.name)}</span></td>
            <td>${t2 && t2.pn
              ? `<span class="crimp-set">${esc(t2.pn)}</span><span class="ds">${esc(accSummary(t2))}</span>`
              : `<span class="crimp-none">not set</span>`}</td>
            <td><select data-crimppin="${pn.id}" style="font-size:10px">
                  <option value="">—</option>
                  ${(acc.crimp?.items||[]).map((it,i) =>
                    `<option value="${i}"${t2 && t2.pn===it.pn?" selected":""}>${esc(it.pn||"(no PN)")}</option>`).join("")}
                </select></td></tr>`;
        }).join("")}
      </table>
    </div>

  <div class="aside-h">Notes</div>
  <textarea id="i-freenote" placeholder="Free text notes for this part">${esc(c.notes||"")}</textarea>`;

  /* --- mates --- */
  box.querySelectorAll("[data-rmmate]").forEach(b => b.onclick = () => {
    mates.splice(+b.dataset.rmmate,1); syncLib(c); render(); inspect(); openSect("s-mates"); });
  $("#m-add-mate").onclick = () => {
    const pn = $("#m-pn-new").value.trim();
    if (!pn) return;
    mates.push({ pn, mfr:$("#m-mfr-new").value.trim(), note:$("#m-note-new").value.trim() });
    syncLib(c); render(); inspect(); openSect("s-mates");
  };

  /* --- accessory categories --- */
  box.querySelectorAll("[data-cat]").forEach(cb => cb.onchange = () => {
    ensureCat(c, cb.dataset.cat).on = cb.checked;
    syncLib(c, true); inspect(); openSect("s-acc");
  });
  box.querySelectorAll("[data-addacc]").forEach(b => b.onclick = () => openAccessoryDialog(c, b.dataset.addacc));
  box.querySelectorAll("[data-rmacc]").forEach(b => b.onclick = () => {
    const [k,i] = b.dataset.rmacc.split(":");
    acc[k].items.splice(+i,1); syncLib(c); inspect(); openSect("s-acc");
  });
  box.querySelectorAll("[data-togreq]").forEach(s => s.onclick = () => {
    const [k,i] = s.dataset.togreq.split(":");
    const it = acc[k].items[+i];
    it.req = it.req === "required" ? "optional" : "required";
    syncLib(c); inspect(); openSect("s-acc");
  });

  /* --- crimp --- */
  if ($("#cr-apply")) $("#cr-apply").onclick = () => {
    const i = $("#cr-family").value;
    if (i === "") return;
    const fam = acc.crimp.items[+i];
    c.pins.forEach(pn => { crimp[pn.id] = { ...fam }; });   // default = one per cavity
    syncLib(c); inspect(); openSect("s-crimp");
  };
  if ($("#cr-clear")) $("#cr-clear").onclick = () => {
    c.crimp = {}; syncLib(c); inspect(); openSect("s-crimp");
  };
  box.querySelectorAll("[data-crimppin]").forEach(sel => sel.onchange = () => {
    const pid = sel.dataset.crimppin;
    if (sel.value === "") delete crimp[pid];
    else crimp[pid] = { ...acc.crimp.items[+sel.value] };
    syncLib(c); inspect(); openSect("s-crimp");
  });

  $("#i-freenote").oninput = e => { c.notes = e.target.value; };
  $("#i-freenote").onchange = () => { syncLib(c); persist(); };
}
function openSect(id){ const d = $("#"+id); if (d) d.open = true; }
function accSummary(it){
  return [it.desc, it.awg, it.finish, it.gender, it.type].filter(Boolean).join(" · ");
}
/* Category visibility is remembered on the library entry (spec 3.2). Item data is
   only pushed back to the library for entries the user is editing directly, never
   the other way round, so a placed part is never reset by a later library change. */
function libEntryFor(c){
  /* Parts from the seed carry no libId, so fall back to matching the entry by name. */
  return (c.libId && library.find(x => x.id === c.libId)) ||
         library.find(x => x.name === c.name) || null;
}
function syncLib(c, catsOnly){
  {
    const e = libEntryFor(c);
    if (e){
      const ea = accOf(e);
      ACC_CATS.forEach(k => { if (accOf(c)[k.key]) (ea[k.key] = ea[k.key] || {items:[]}).on = catOn(c,k.key); });
      if (!catsOnly){
        ACC_CATS.forEach(k => { if (accOf(c)[k.key]) ea[k.key].items = JSON.parse(JSON.stringify(accOf(c)[k.key].items||[])); });
        e.mates = JSON.parse(JSON.stringify(c.mates||[]));
      }
      e.dirty = true; saveLibrary();
    }
  }
  persist();
}

      <div><label>Type</label><select id="a-type">${TERM_TYPES.map(x=>`<option value="${x}">${x||"—"}</option>`).join("")}</select></div>
    </div>

      <button class="mini" id="a-cancel">Cancel</button>
      <button class="mini" id="a-save" style="border-color:var(--accent);color:var(--accent)">Add</button>
    </div>`);
  $("#a-cancel").onclick = closeModal;
  $("#a-save").onclick = () => {
    const pn = $("#a-pn").value.trim();
    if (!pn){ showErr("a-err","A part number is required."); return; }
    ensureCat(c, key).items.push({

    });

function esc(s){ return String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":"&#39;"}[m])); }
function toHex(c){ return (c && c[0]==="#" && c.length===7) ? c : "#888888"; }

function screenToWorld(ev){
  const r = $("#stage-wrap").getBoundingClientRect();
  return {
    x: (ev.clientX - r.left - state.view.x) / state.view.k,
    y: (ev.clientY - r.top - state.view.y) / state.view.k
  };
}
function hitComp(pt){
  const list = state.components.filter(c => visible(c) && !(state.rails && RAILS[c.id]));
  for (let i=list.length-1;i>=0;i--){
    const b = hitBox(list[i]);
    if (pt.x>=b.x && pt.x<=b.x+b.w && pt.y>=b.y && pt.y<=b.y+b.h) return list[i];
  }
  return null;
}

const wrap = $("#stage-wrap");
const DRAG_SLOP = 4;           // screen px before a press becomes a drag
const SNAP_TOL  = 10;          // world px within which a drag snaps to an axis / 45deg

/* Snap a dragged point to horizontal, vertical, then 45deg against nearby anchors. */
function snapPoint(pt, anchors){
  let x = pt.x, y = pt.y, sx = false, sy = false;
  anchors.forEach(a => {
    if (!a) return;
    if (!sx && Math.abs(pt.x - a.x) < SNAP_TOL){ x = a.x; sx = true; }
    if (!sy && Math.abs(pt.y - a.y) < SNAP_TOL){ y = a.y; sy = true; }
  });
  if (!sx && !sy){
    for (const a of anchors){
      if (!a) continue;
      const dx = pt.x - a.x, dy = pt.y - a.y;
      const d = (Math.abs(dx) - Math.abs(dy));
      if (Math.abs(d) < SNAP_TOL){                       // near a 45deg diagonal
        const m = (Math.abs(dx) + Math.abs(dy)) / 2;
        x = a.x + Math.sign(dx) * m;
        y = a.y + Math.sign(dy) * m;
        break;
      }
    }
  }
  return { x: Math.round(x), y: Math.round(y) };
}
function wireEnds(w){
  const a = findC(w.from.c), b = findC(w.to.c);
  const pa = a && findPin(a, w.from.p), pb = b && findPin(b, w.to.p);
  if (!pa || !pb) return null;
  return { A: pinXY(a, pa), B: pinXY(b, pb) };
}
function polyLen(pts){
  let L = 0;
  for (let i=1;i<pts.length;i++) L += Math.abs(pts[i][0]-pts[i-1][0]) + Math.abs(pts[i][1]-pts[i-1][1]);
  return L;
}
/* Insert a waypoint where it costs the least extra wire, which keeps fix points
   in path order however the user adds them. */
function insertFix(w, p){
  const e = wireEnds(w); if (!e) return;
  const cur = w.fixes || [];
  let best = 0, bestL = Infinity;
  for (let i=0;i<=cur.length;i++){
    const trial = cur.slice(0,i).concat([p], cur.slice(i));
    const L = polyLen(wirePoints(e.A, e.B, 0, trial));
    if (L < bestL){ bestL = L; best = i; }
  }
  w.fixes = cur.slice(0,best).concat([p], cur.slice(best));
  return best;
}

wrap.addEventListener("mousedown", ev => {
  hideCtx();
  if (ev.button === 1 || ev.button === 2) return;
  const tgt = ev.target;
  const d = tgt.dataset || {};
  const pt = screenToWorld(ev);

  // 1. pinned waypoint on the selected wire
  if (tgt.classList?.contains("fixpt")){
    ui.fix = { id:d.fix, idx:+d.fixIdx };
    ev.preventDefault(); return;
  }
  // 2. wire endpoint grip -> reattach to another terminal
  if (tgt.classList?.contains("endpt")){
    ui.reattach = { id:d.endWire, end:d.end };
    ev.preventDefault(); return;
  }
  // 3. wire label -> select the wire and allow nudging the label clear of wires
  if (tgt.classList?.contains("wlabel")){
    const w = state.wires.find(x => x.id === d.labelFor);
    state.sel = d.labelFor;
    ui.label = { id:d.labelFor, start:pt, base:{ ...(w?.labelOff || {x:0,y:-7}) } };
    render(); inspect(); ev.preventDefault(); return;
  }
  // 4. power / ground rail tap -> selects its wire, drag to reposition the symbol
  if (tgt.classList?.contains("rail-hit")){
    const w = state.wires.find(x => x.id === d.rail);
    state.sel = d.rail;
    ui.rail = { id:d.rail, start:pt, base:{ ...(w?.railOff || {x:0,y:0}) } };
    render(); inspect(); ev.preventDefault(); return;
  }
  // 5. terminal -> press becomes a wire only once the pointer actually moves,
  //    so a plain click still selects the part underneath (splices especially)
  const handle = tgt.closest?.(".handle-hit");
  if (handle){
    ui.pendWire = { from:{ c:handle.dataset.cid, p:handle.dataset.pid }, sx:ev.clientX, sy:ev.clientY };
    ev.preventDefault(); return;
  }
  // 6. wire body -> select; dragging it drops a fix point and reroutes
  const wid = (tgt.classList?.contains("wire") || tgt.classList?.contains("wire-hit")) ? d.id : null;
  if (wid){
    state.sel = wid;
    ui.pendSeg = { id:wid, sx:ev.clientX, sy:ev.clientY };
    render(); inspect(); return;
  }
  // 7. component
  const c = hitComp(pt);
  if (c){
    state.sel = c.id;
    if ($("#tog-focus").checked) state.focus = c.id;
    ui.drag = { id:c.id, dx: pt.x - ex(c), dy: pt.y - ey(c), moved:false };
    render(); inspect();
  } else {
    state.sel = null; state.focus = null;
    render(); inspect();
    ui.pan = { x:ev.clientX - state.view.x, y:ev.clientY - state.view.y };
    wrap.classList.add("panning");
  }
});

window.addEventListener("mousemove", ev => {
  if (ui.pan){ state.view.x = ev.clientX-ui.pan.x; state.view.y = ev.clientY-ui.pan.y; applyView(); return; }

  if (ui.drag){
    const pt = screenToWorld(ev), c = findC(ui.drag.id);
    c.x = Math.round(((pt.x-ui.drag.dx)/state.spread)/8)*8;
    c.y = Math.round(((pt.y-ui.drag.dy)/state.spread)/8)*8;
    render(); return;
  }
  if (ui.fix){
    const w = state.wires.find(x => x.id === ui.fix.id);
    const e = w && wireEnds(w); if (!e) return;
    const others = (w.fixes||[]).filter((_,i) => i !== ui.fix.idx);
    w.fixes[ui.fix.idx] = snapPoint(screenToWorld(ev), [e.A, e.B, ...others]);
    render(); return;
  }
  if (ui.reattach){
    const pt = screenToWorld(ev);
    let ghost = document.getElementById("ghost");
    if (!ghost){ ghost = el("path", { id:"ghost", class:"wire dash", stroke:"#e8b849" }); $("#canvas").appendChild(ghost); }
    const w = state.wires.find(x => x.id === ui.reattach.id);
    const keep = ui.reattach.end === "from" ? w.to : w.from;
    const kc = findC(keep.c), kp = kc && findPin(kc, keep.p);
    if (!kp) return;
    const K = pinXY(kc, kp);
    ghost.setAttribute("d", `M${K.x},${K.y} L${pt.x},${pt.y}`);
    return;
  }
  if (ui.label){
    const w = state.wires.find(x => x.id === ui.label.id); if (!w) return;
    const pt = screenToWorld(ev);
    w.labelOff = { x: Math.round(ui.label.base.x + pt.x - ui.label.start.x),
                   y: Math.round(ui.label.base.y + pt.y - ui.label.start.y) };
    render(); return;
  }
  if (ui.rail){
    const w = state.wires.find(x => x.id === ui.rail.id); if (!w) return;
    const pt = screenToWorld(ev);
    w.railOff = { x: Math.round(ui.rail.base.x + pt.x - ui.rail.start.x),
                  y: Math.round(ui.rail.base.y + pt.y - ui.rail.start.y) };
    render(); return;
  }
  if (ui.pendSeg){
    if (Math.hypot(ev.clientX-ui.pendSeg.sx, ev.clientY-ui.pendSeg.sy) < DRAG_SLOP) return;
    const w = state.wires.find(x => x.id === ui.pendSeg.id);
    const e = w && wireEnds(w);
    if (e){
      const p = snapPoint(screenToWorld(ev), [e.A, e.B, ...(w.fixes||[])]);
      const idx = insertFix(w, p);
      ui.fix = { id:w.id, idx };
    }
    ui.pendSeg = null; render(); return;
  }
  if (ui.pendWire){
    if (Math.hypot(ev.clientX-ui.pendWire.sx, ev.clientY-ui.pendWire.sy) < DRAG_SLOP) return;
    ui.wire = { from: ui.pendWire.from }; ui.pendWire = null;
  }
  if (ui.wire){
    const pt = screenToWorld(ev);
    let ghost = document.getElementById("ghost");
    if (!ghost){ ghost = el("path", { id:"ghost", class:"wire dash", stroke:"#aaa" }); $("#canvas").appendChild(ghost); }
    const a = findC(ui.wire.from.c), pa = a && findPin(a, ui.wire.from.p);
    if (!pa) return;
    const A = pinXY(a, pa);
    ghost.setAttribute("d", `M${A.x},${A.y} L${pt.x},${pt.y}`);
  }
});

window.addEventListener("mouseup", ev => {
  wrap.classList.remove("panning");
  const handle = ev.target.closest?.(".handle-hit");

  if (ui.wire){
    if (handle && (handle.dataset.cid !== ui.wire.from.c || handle.dataset.pid !== ui.wire.from.p)){
      state.wires.push({
        id: uid("w"), from: ui.wire.from, to:{ c:handle.dataset.cid, p:handle.dataset.pid },
        net:"SIG", color:NET_COLORS.SIG, label:"SIG", dashed:true, fixes:[]
      });
    }
    ui.wire = null; render();
  } else if (ui.pendWire){
    /* Press and release on a terminal without moving: treat it as selecting the part. */
    const c = findC(ui.pendWire.from.c);
    if (c){
      state.sel = c.id;
      if ($("#tog-focus").checked) state.focus = c.id;
      render(); inspect();
    }
    ui.pendWire = null;
  } else if (ui.reattach){
    const w = state.wires.find(x => x.id === ui.reattach.id);
    if (w && handle){
      const other = ui.reattach.end === "from" ? w.to : w.from;
      if (handle.dataset.cid !== other.c || handle.dataset.pid !== other.p){
        w[ui.reattach.end] = { c:handle.dataset.cid, p:handle.dataset.pid };
      }
    }
    document.getElementById("ghost")?.remove();
    ui.reattach = null; render(); inspect();
  } else if (ui.pendSeg){
    ui.pendSeg = null;
  }
  if (ui.fix || ui.label || ui.rail){ ui.fix = ui.label = ui.rail = null; persist(); }
  ui.drag = null; ui.pan = null;
});
wrap.addEventListener("wheel", ev => {
  ev.preventDefault();
  const r = wrap.getBoundingClientRect();
  const mx = ev.clientX-r.left, my = ev.clientY-r.top, old = state.view.k;
  const next = Math.min(2.2, Math.max(0.12, old * (ev.deltaY>0 ? 0.9 : 1.1)));
  state.view.x = mx - ((mx-state.view.x)/old)*next;
  state.view.y = my - ((my-state.view.y)/old)*next;
  state.view.k = next;
  if ((old < ZOOM_LABEL_AT) !== (next < ZOOM_LABEL_AT)) render();
  applyView(); $("#zoom-lbl").textContent = Math.round(next*100)+"%";
}, {passive:false});
window.addEventListener("resize", () => applyView());

window.addEventListener("keydown", ev => {
  if (/input|textarea|select/i.test(ev.target.tagName)) return;
  if ((ev.key==="Delete" || ev.key==="Backspace") && state.sel){
    state.components = state.components.filter(c => c.id!==state.sel);
    state.wires = state.wires.filter(w => w.id!==state.sel && w.from.c!==state.sel && w.to.c!==state.sel);
    state.sel = null; state.focus = null; render(); inspect();
  }
  if (ev.key==="Escape"){ hideCtx(); state.sel=null; state.focus=null; render(); inspect(); }
  if (ev.key==="f" && state.sel) { state.focus = state.sel; render(); }
});

wrap.addEventListener("contextmenu", ev => {
  ev.preventDefault();
  const pt = screenToWorld(ev);
  const menu = $("#ctx");
  menu.style.display="block"; menu.style.left=ev.clientX+"px"; menu.style.top=ev.clientY+"px";

  const d = ev.target.dataset || {};
  const wid = (ev.target.classList?.contains("wire") || ev.target.classList?.contains("wire-hit")) ? d.id
            : ev.target.classList?.contains("fixpt") ? d.fix
            : ev.target.classList?.contains("rail-hit") ? d.rail
            : ev.target.classList?.contains("wlabel") ? d.labelFor : null;
  if (wid){
    const w = state.wires.find(x => x.id === wid);
    const onFix = ev.target.classList?.contains("fixpt") ? +d.fixIdx : -1;
    state.sel = wid; render(); inspect();
    menu.innerHTML = `<button data-w="addfix">Add fix point</button>` +
      (onFix >= 0 ? `<button data-w="rmfix">Remove this fix point</button>` : "") +
      ((w.fixes||[]).length ? `<button data-w="clearfix">Clear all fix points (${w.fixes.length})</button>` : "") +
      `<button data-w="resetlabel">Reset label position</button>
       <div class="sep"></div>
       <button data-w="del">Delete wire</button>`;
    menu.onclick = e => {
      const a = e.target.dataset.w; if (!a) return;
      if (a==="addfix"){ w.fixes = w.fixes || []; insertFix(w, { x:Math.round(pt.x), y:Math.round(pt.y) }); }
      if (a==="rmfix") w.fixes.splice(onFix, 1);
      if (a==="clearfix") w.fixes = [];
      if (a==="resetlabel"){ delete w.labelOff; delete w.railOff; }
      if (a==="del") state.wires = state.wires.filter(x => x.id !== wid);
      hideCtx(); render(); inspect();
    };
    return;
  }

  const c = hitComp(pt);
  if (c && c.kind!=="note"){

      <button data-act="del">Delete</button>`;

      const a = e.target.dataset.act;
      if (a==="focus") state.focus = c.id;
      if (a==="hide") state.hidden[groupOf(c)] = true;
      if (a==="flip") c.pins.forEach(p => p.side = p.side==="right" ? "left" : "right");
      if (a==="dup"){ const n = structuredClone(c); n.id=uid("c"); n.ident=(c.ident||"X")+"'"; n.x+=30; n.y+=30; state.components.push(n); }
      if (a==="del"){ state.components=state.components.filter(x=>x.id!==c.id); state.wires=state.wires.filter(w=>w.from.c!==c.id&&w.to.c!==c.id); }
      hideCtx(); render(); inspect();
    };
  } else {
    menu.innerHTML = `<button data-add="connector">Connector</button>
      <button data-add="splice">Splice</button>
      <button data-add="resistor">Resistor</button>
      <button data-add="note">Note</button>
      <div class="sep"></div>
      <button data-add="sensor3">3-pin sensor</button>
      <button data-add="relay">Relay</button>
      <button data-add="can-node">CAN node</button>`;
    menu.onclick = e => { if (e.target.dataset.add) addAt(e.target.dataset.add, pt); hideCtx(); };
  }
});

/* ============================ COMPONENT LIBRARY ============================
   Data-driven, searchable, and persisted separately from the schematic so that
   library edits never touch parts already placed on the canvas. */
const LIB_STORAGE = "st185-harness-lib-v1";

/* Generic primitives that are not part of the ST185 seed. */
const LIB_PRIMITIVES = [
  { id:"prim-connector", name:"Connector (generic)", kind:"connector", w:COMP_W,
    desc:"Blank 3-way connector", pins:[["1","12V","right"],["2","GND","right"],["3","SIG","right"]] },
  { id:"prim-splice",    name:"Splice", kind:"splice", w:24,
    desc:"Junction / splice point", pins:[["1","NET","right"]] },
  { id:"prim-resistor",  name:"Resistor", kind:"resistor", w:170,
    desc:"Two-terminal resistor", pins:[["1","A","right"],["2","B","right"]] },
  { id:"prim-relay",     name:"Relay (generic)", kind:"connector", w:COMP_W,
    desc:"ISO micro relay, 4 terminal",
    pins:[["1","86 coil","right"],["2","85 LS","right"],["3","30 12V","right"],["4","87 out","right"]] },
  { id:"prim-sensor3",   name:"Sensor, 3-pin", kind:"connector", w:COMP_W,
    desc:"Ratiometric sensor, 5V / SIG / GND",
    pins:[["1","5V","right"],["2","SIG","right"],["3","GND","right"]] },
  { id:"prim-sensor2",   name:"Sensor, 2-pin", kind:"connector", w:COMP_W,
    desc:"Two-wire sensor or switch", pins:[["1","SIG","right"],["2","GND","right"]] },
  { id:"prim-cannode",   name:"CAN device (generic)", kind:"connector", w:COMP_W,
    desc:"Powered CAN bus node",
    pins:[["1","12V","right"],["2","GND","right"],["3","CANH","right"],["4","CANL","right"]] },
  { id:"prim-note",      name:"Note", kind:"note", w:260, desc:"Free-text callout", pins:[] }
];

/* Manufacturers only where the repo itself already names them. Nothing invented. */
const LIB_MFR = [
  [/XtremeX|CAN-Lambda|G4X/i, "Link ECU"],
  [/CSB3|ECUMaster/i,         "ECUMaster"],
  [/SN65HVD230/i,             "Texas Instruments"],
  [/Bosch/i,                  "Bosch"],
  [/Continental/i,            "Continental"],
  [/Waveshare/i,              "Waveshare"],
  [/Pi 5|Raspberry/i,         "Raspberry Pi"]
];
function guessMfr(name){
  for (const [re, m] of LIB_MFR) if (re.test(name)) return m;
  return "";
}

/* Accessory categories offered per component. The catalogue itself is user-entered:
   no terminal part numbers are shipped, because guessing them would be worse than blank. */
const ACC_CATS = [
  { key:"crimp",     name:"Crimp terminals (by AWG)" },
  { key:"seal",      name:"Wire seals" },
  { key:"wedge",     name:"Wedge locks / TPA" },
  { key:"backshell", name:"Backshells / strain relief" },
  { key:"boot",      name:"Boots (straight, right-angle, heat-shrink, rubber, silicone)" },
  { key:"plug",      name:"Cavity plugs / blanking seals" },
  { key:"tool",      name:"Crimp tools / dies" }
];
const FINISHES = ["", "gold", "silver", "tin", "nickel"];
const GENDERS  = ["", "pin", "socket"];
const TERM_TYPES = ["", "closed barrel", "open barrel", "stamped & formed", "machined",
                    "insulated", "non-insulated", "solder"];

function accOf(o){ return (o.accessories = o.accessories || {}); }
function catOn(o, key){
  const a = accOf(o)[key];
  return a ? !!a.on : false;
}
function ensureCat(o, key){
  const a = accOf(o);
  if (!a[key]) a[key] = { on:false, items:[] };
  return a[key];
}

let library = [];

/* Every part the ST185 seed uses becomes a library entry, so nothing that is
   already on the canvas is missing from the library. */
function buildLibrary(){
  const entries = LIB_PRIMITIVES.map(e => ({
    id:e.id, name:e.name, mfr:"", pn:"", desc:e.desc, kind:e.kind, w:e.w,
    pins:e.pins.map(([num,nm,side]) => ({ num, name:nm, side })),
    image:null, builtin:true, primitive:true,
    mates:[], accessories:{}, crimp:{}, notes:""
  }));
  const seen = new Set(entries.map(e => e.name.toLowerCase()));
  buildST185().components.forEach(c => {
    if (c.kind === "note") return;
    const key = c.name.toLowerCase();
    if (seen.has(key)) return;
    seen.add(key);
    entries.push({
      id:"lib-" + c.id, name:c.name, mfr:guessMfr(c.name), pn:"",
      desc:(c.note || "").slice(0, 160), kind:c.kind, w:c.w || COMP_W,
      pins:(c.pins||[]).map(pn => ({ num:pn.num, name:pn.name, side:pn.side })),
      image:null, builtin:true, primitive:false, group:GROUP_OF[c.id] || "misc",
      mates:[], accessories:{}, crimp:{}, notes:""
    });
  });
  return entries;
}
function saveLibrary(){
  try{
    /* Only user entries and user edits are stored; builtins rebuild from the seed. */
    const diff = library.filter(e => !e.builtin || e.dirty);
    localStorage.setItem(LIB_STORAGE, JSON.stringify(diff));
  }catch(e){}
}
function loadLibrary(){
  library = buildLibrary();
  try{
    const saved = JSON.parse(localStorage.getItem(LIB_STORAGE) || "[]");
    saved.forEach(s => {
      const i = library.findIndex(e => e.id === s.id);
      if (i >= 0) library[i] = { ...library[i], ...s };
      else library.push(s);
    });
  }catch(e){}
}

/* Simple relevance: earlier and more exact matches score higher. */
function libScore(e, q){
  if (!q) return 1;
  const hay = [e.pn, e.name, e.mfr, e.desc].map(v => (v||"").toLowerCase());
  let best = 0;
  const weights = [100, 80, 50, 30];
  hay.forEach((h, i) => {
    if (!h) return;
    const at = h.indexOf(q);
    if (at < 0) return;
    let s = weights[i] - Math.min(at, 20);
    if (at === 0) s += 25;
    else if (/[\s\-_/]/.test(h[at-1])) s += 12;
    if (h === q) s += 40;
    best = Math.max(best, s);
  });
  return best;
}
function libResults(){
  const q = ($("#lib-search").value || "").trim().toLowerCase();
  return library
    .map(e => ({ e, s: libScore(e, q) }))
    .filter(r => r.s > 0)
    .sort((a,b) => b.s - a.s || a.e.name.localeCompare(b.e.name))
    .map(r => r.e);
}
function renderLibrary(){
  const res = libResults();
  const box = $("#lib-list");
  $("#lib-count").textContent = res.length + "/" + library.length;
  if (!res.length){
    box.innerHTML = `<div class="lib-empty">No match. Refine the text, use
      <b>+ Add component</b> to enter it by hand, or <b>Find more…</b> to look it up.</div>`;
    return;
  }
  box.innerHTML = res.slice(0, 400).map(e => {
    const sub = [e.mfr, e.pn].filter(Boolean).join(" · ") ||
                (e.pins.length ? e.pins.length + " pins" : "no pins");
    const th = e.image ? `style="background-image:url('${e.image}')"` : "";
    return `<div class="lib-row" data-lib="${e.id}" title="${esc(e.desc || e.name)}">
      <div class="lib-thumb" ${th}></div>
      <div class="lib-meta">
        <div class="lib-nm">${esc(e.name)}</div>
        <div class="lib-sub">${esc(sub)}${e.pins.length ? " · " + e.pins.length + "p" : ""}</div>
      </div>
      <button class="lib-edit" data-libedit="${e.id}" title="Edit entry">edit</button>
    </div>`;
  }).join("");
  box.querySelectorAll("[data-lib]").forEach(r => {
    r.onclick = ev => {
      if (ev.target.dataset.libedit) return;
      placeLibraryItem(r.dataset.lib);
    };
  });
  box.querySelectorAll("[data-libedit]").forEach(b => {
    b.onclick = ev => { ev.stopPropagation(); openComponentDialog(b.dataset.libedit); };
  });
}

function centreWorld(){
  const r = wrap.getBoundingClientRect();
  return { x:(r.width/2 - state.view.x)/state.view.k, y:(r.height/2 - state.view.y)/state.view.k };
}
function instanceFrom(entry, wx, wy){
  const id = uid("c");
  const base = {
    id, kind:entry.kind || "connector", name:entry.name, ident:(entry.pn || "").slice(0,6) || "X",
    x:Math.round((wx/state.spread)/8)*8, y:Math.round((wy/state.spread)/8)*8,
    w:entry.w || COMP_W, status:"tbd", note:entry.desc || "", unwired:false,
    group:entry.group || "misc",
    pins:(entry.pins||[]).map((pn,i) => ({ id:"p"+(i+1), num:pn.num || String(i+1),
                                           name:pn.name, side:pn.side || "right" })),
    /* Copied by value: later library edits must never rewrite a placed part. */
    libId:entry.id, mfr:entry.mfr || "", pn:entry.pn || "",
    mates:JSON.parse(JSON.stringify(entry.mates || [])),
    accessories:JSON.parse(JSON.stringify(entry.accessories || {})),
    crimp:JSON.parse(JSON.stringify(entry.crimp || {})),
    image:entry.image || null
  };
  if (entry.kind === "note"){ base.h = 100; base.pins = []; base.note = entry.desc || "…"; }
  return base;
}
function placeLibraryItem(libId){
  const e = library.find(x => x.id === libId); if (!e) return;
  const c = centreWorld();
  const inst = instanceFrom(e, c.x, c.y);
  state.components.push(inst);
  /* Optional mate placement. Inert when the entry has no mate assigned yet. */
  if ($("#lib-mate").checked && (e.mates||[]).length){
    const mate = e.mates[0];
    const mEntry = library.find(x => x.pn && mate.pn && x.pn.toLowerCase() === mate.pn.toLowerCase());
    const mi = mEntry
      ? instanceFrom(mEntry, c.x + (inst.w + 90) * state.spread, c.y)
      : instanceFrom({ ...e, id:e.id + "-mate", name:(mate.pn || "Mate") + " (mate)",
                       pins:(e.pins||[]).map(pp => ({ ...pp, side: pp.side === "right" ? "left" : "right" })) },
                     c.x + (inst.w + 90) * state.spread, c.y);
    mi.isMateOf = inst.id;
    state.components.push(mi);
  }
  state.sel = inst.id; state.focus = null;
  render(); inspect(); saveLibrary();
}

function openComponentDialog(libId){
  const e = libId ? library.find(x => x.id === libId) : null;
  const pinText = e ? (e.pins||[]).map(p => `${p.num}, ${p.name}, ${p.side}`).join("\n")

        <select id="m-kind">

    </div>
