name: Caliber Sync

# Runs on every push to main so Caliber keeps CALIBER_LEARNINGS.md and .caliber/
# state current without anyone remembering to trigger it.
#
# Loop-safe the same way the research-hub workflow is: the job skips runs actored
# by the bot, so Caliber's own auto-refresh commit cannot re-trigger it.
#
# The gate step below skips cleanly (green, with a message) when
# ANTHROPIC_API_KEY is not set on the repo, instead of failing every push.
# Add that secret and the sync starts working with no further edits here.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: caliber-sync-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check for ANTHROPIC_API_KEY
        id: gate
        env:
          KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$KEY" ]; then
            echo "::notice::ANTHROPIC_API_KEY is not set on this repo - skipping Caliber sync."
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.ready == 'true'
        with:
          fetch-depth: 0

      - uses: caliber-ai-org/ai-setup@v1
        if: steps.gate.outputs.ready == 'true'
        with:
          mode: sync
          auto-refresh: true
          comment: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
