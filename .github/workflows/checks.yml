name: Repo checks

# Runs the repo gates (tools/check_all.py: the one wiring check, drawings, BOM, CAD), byte-compiles the CAN
# bench/sender code, runs the CAN parity check (including the frozen cluster firmware,
# checked out read-only from its public repo) and the tune seed-table check.
#
# Runs on EVERY pull request and push to main so the "Repo checks" status always
# reports (it is a required check - a path-filtered workflow that never starts
# would leave unrelated PRs stuck at "Expected - waiting"). The path test now
# happens inside the job: if no checked file changed, the heavy steps are
# skipped and the check passes in seconds. tools/check_all.py does NOT run for
# unrelated changes.
#
# Python 3.14 matches the local dev machine (dansPC) and research-hub.yml.
# Everything is standard-library only except the BOM workbook (openpyxl), the drawing read-back in
# build_drawings.py --check (PyMuPDF) and tune/scripts/validate_tune.py (PyYAML) - each installed
# pinned (same version as on dansPC) right before its step.
on:
  push:
    branches: [main]
  pull_request:
    types: [opened, synchronize, reopened, edited]   # edited: re-check when the body gains its Rows: line
  workflow_dispatch:
  schedule:
    - cron: '0 6 * * 1'   # weekly: catch drift in the frozen cluster repo (it can change without a PR here)

permissions:
  contents: read

jobs:
  checks:
    name: Repo checks
    # The research-hub bot's own commits are skipped (a skipped job counts as passing).
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # need history to see which files this change touched
      - name: Which files did this change touch?
        id: scope
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "workflow_dispatch" ] || [ "$EVENT" = "schedule" ]; then echo "run=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          if [ "$EVENT" = "pull_request" ]; then RANGE="$PR_BASE...$PR_HEAD"; FIRST="$PR_BASE"; else RANGE="$PUSH_BEFORE..$PUSH_AFTER"; FIRST="$PUSH_BEFORE"; fi
          if [ -z "$FIRST" ] || [ "$FIRST" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$FIRST^{commit}" 2>/dev/null; then
            echo "Cannot tell what changed - running everything."; echo "run=true" >> "$GITHUB_OUTPUT"; exit 0
          fi
          CHANGED="$(git diff --name-only "$RANGE")"
          echo "Changed files:"; echo "$CHANGED"
          if echo "$CHANGED" | grep -qE '^(sot/|docs/harness/|bench/|apps/|tune/|docs/intercooler-turbo-study/model/inputs\.yaml$|XTREMEX-IO-TABLE\.html$|link_g4x_can_setup\.(json|lcs)$|link_g4x_realdash\.xml$|switchboard_frames\.json$|CAN-BUS-ID-ALLOCATION-TABLE\.md$|docs/sourcing/|tools/check_all\.py$|tools/check_doc_claims\.py$|\.github/workflows/checks\.yml$)'; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "No checked files changed - skipping the checks (reported as passed)."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi
      # Doc hygiene runs on every change (Markdown edits skip the heavy steps above).
      # WARN-ONLY: shows warning annotations, never fails the check.
      - name: Doc hygiene - passages duplicated across .md files (warn-only)
        run: python3 .github/scripts/check_doc_duplicates.py
      - name: Doc hygiene - oversized or unlisted .md files (warn-only)
        run: python3 .github/scripts/check_doc_size.py
      # Docs stay current (M3, DECISIONS R118): run on every change, not only wiring files.
      - name: PR body has a Rows line (OPEN-ITEMS rows touched, or none)
        if: github.event_name == 'pull_request'
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: python3 .github/scripts/check_pr_rows.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Tracker counts match (build-research-hub.py --strict, writes nothing)
        run: python docs/build-research-hub.py --strict
      - name: Docs gate self-tests (Rows line + --strict)
        run: python .github/scripts/test_docs_gates.py
      - name: Install openpyxl (BOM workbook) and PyMuPDF (drawing read-back, R224 step 4), pinned
        if: steps.scope.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check openpyxl==3.1.5 pymupdf==1.28.0
      - name: Repo gates (tools/check_all.py)
        if: steps.scope.outputs.run == 'true'
        run: python tools/check_all.py
      - name: Tree unchanged after check_all
        if: steps.scope.outputs.run == 'true'
        run: git diff --exit-code
      - name: Wiring check self-test (every check fails on a broken copy)
        if: steps.scope.outputs.run == 'true'
        run: python docs/harness/tools/check_wiring.py --self-test
      - name: Byte-compile CAN tooling
        if: steps.scope.outputs.run == 'true'
        run: python -m py_compile bench/frames.py bench/can_bench.py apps/trackcluster-can-sender/app.py
      - name: Check out the frozen cluster firmware (public repo, read-only)
        if: steps.scope.outputs.run == 'true'
        uses: actions/checkout@v4
        with:
          repository: living-relation/center-cluster-esp32-p4
          ref: main
          path: _cluster
          persist-credentials: false
      - name: CAN parity (JSON / .lcs / frames.py / ID table / RealDash XML / sender UI / cluster source)
        if: steps.scope.outputs.run == 'true' && hashFiles('bench/check_parity.py') != ''
        env:
          CLUSTER_DIR: _cluster
          CLUSTER_REQUIRED: '1'
        run: python bench/check_parity.py
      - name: Install PyYAML for the tune checker (pinned)
        if: steps.scope.outputs.run == 'true'
        run: python -m pip install --disable-pip-version-check pyyaml==6.0.3
      - name: Tune seed tables (validate_tune.py)
        if: steps.scope.outputs.run == 'true'
        run: python tune/scripts/validate_tune.py
