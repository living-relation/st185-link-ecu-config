name: Regenerate research hub

# Keeps docs/research-hub.html in sync with the docs/ sources it indexes.
# Loop-safe by three independent guards:
#   1. path filter excludes the generated file itself,
#   2. the bot's commit carries [skip ci] so it never re-triggers CI,
#   3. the job skips runs actored by the bot,
# and the generator is idempotent, so a redundant run produces no diff.
#
# PRs that touch docs/ or this workflow run the same generator as a check
# and attach the HTML as an artifact. They do not commit it — only main does.
on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - '!docs/research-hub.html'
      - '.github/workflows/research-hub.yml'
  pull_request:
    paths:
      - 'docs/**'
      - '!docs/research-hub.html'
      - '.github/workflows/research-hub.yml'
  workflow_dispatch:

concurrency:
  group: research-hub-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  regenerate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0  # generator reads git history for per-file "modified" dates
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Regenerate research hub
        run: python3 docs/build-research-hub.py
      - name: Check hub built
        run: |
          test -s docs/research-hub.html
          python3 -c "
          from pathlib import Path
          import json
          html = Path('docs/research-hub.html').read_text(encoding='utf-8')
          start = html.index('const DATA = ') + len('const DATA = ')
          data, _ = json.JSONDecoder().raw_decode(html[start:])
          tables = (data.get('parts') or {}).get('tables') or {}
          assert data.get('topics'), 'hub has no topics'
          assert 'buy' in tables, 'hub is missing the NEED-TO-BUY table'
          print('topics', len(data['topics']), 'tables', sorted(tables))
          "
      - name: Upload preview HTML
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: research-hub.html
          path: docs/research-hub.html
      - name: Commit regenerated hub if it changed
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: |
          if [ -n "$(git status --porcelain docs/research-hub.html)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add docs/research-hub.html
            git commit -m "Auto-regenerate research hub [skip ci]"
            # Someone may have pushed while this job ran. Rebase and retry rather
            # than failing the run and leaving the hub stale.
            for i in 1 2 3; do
              git push && exit 0
              git pull --rebase -X ours origin main || true
            done
            echo "push failed after 3 attempts" >&2
            exit 1
          else
            echo "research-hub.html already up to date"
          fi
