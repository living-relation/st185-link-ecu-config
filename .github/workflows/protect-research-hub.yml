name: Protect research hub

# docs/research-hub.html is generated and committed only by the
# "Regenerate research hub" Action (research-hub.yml). This guard fails any other
# change that touches that file - the cloud/web-edit twin of .githooks/pre-commit.
#
# Runs on EVERY pull request and push to main so the required "Protect research
# hub" status always reports (no path filter - a filtered workflow that never
# starts would leave unrelated PRs stuck at "Expected - waiting"). The file test
# happens inside the job and takes seconds. It never runs check_all; that stays
# in checks.yml.
on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    name: Protect research hub
    # Same bot skip as checks.yml (a skipped job counts as passing).
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Refuse human / agent edits to docs/research-hub.html
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_AFTER: ${{ github.sha }}
        run: |
          set -euo pipefail
          if [ "$EVENT" = "pull_request" ]; then RANGE="$PR_BASE...$PR_HEAD"; FIRST="$PR_BASE"; else RANGE="$PUSH_BEFORE..$PUSH_AFTER"; FIRST="$PUSH_BEFORE"; fi
          if [ -z "$FIRST" ] || [ "$FIRST" = "0000000000000000000000000000000000000000" ] || ! git cat-file -e "$FIRST^{commit}" 2>/dev/null; then
            echo "Cannot tell what changed (new branch or rewritten history) - nothing to check."; exit 0
          fi
          if git diff --name-only "$RANGE" | grep -qx 'docs/research-hub.html'; then
            echo "::error file=docs/research-hub.html::docs/research-hub.html is bot-owned; remove it from this change."
            echo "docs/research-hub.html is bot-owned; remove it from this change."
            exit 1
          fi
          echo "docs/research-hub.html not touched - OK."
