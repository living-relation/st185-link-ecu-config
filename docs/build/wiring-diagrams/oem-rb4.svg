<text x="10.00" y="19.00" font-size="2.30" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">Relay block REMOVED (R12). Its factory leads stay in the loom; we splice into the lead where the relay pin was (EWD 1993 p.66, p.215).</text>
