<text x="10.00" y="12.00" font-size="4.60" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">IG2 PLUG - UNDER THE ECU, COWL SIDE</text>
<text x="10.00" y="19.00" font-size="2.30" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">Cabin plug under the ECU; the engine-side wire is removed. We splice into the cowl-side leads (EWD 1993 p.74-75).</text>
<text x="17.00" y="53.80" font-size="2.70" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">IG2</text>
<text x="17.00" y="60.60" font-size="2.50" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">pin 15</text>
<text x="50.00" y="60.60" font-size="2.30" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">B-R</text>
<text x="121.00" y="60.60" font-size="1.90" text-anchor="end" fill="#334" font-family="Helvetica, Arial, sans-serif">EWD 1993 p.74-75</text>
<text x="17.00" y="64.30" font-size="1.90" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">J/B No.1 ECU-IG 15A (1B-8 via J3) -&gt; trunk kill switch 2nd pair -&gt; alternator IG (G2-3)</text>
<text x="145.50" y="58.60" font-size="1.70" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">factory lead B-R</text>
<circle cx="168.00" cy="60.00" r="1.50" fill="#14213d" stroke="none" stroke-width="0.20"/>
<text x="171.00" y="56.80" font-size="2.30" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">FL_OEM_IG2_C15</text>
<text x="171.00" y="64.00" font-size="1.90" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">crimp butt splice into the factory cowl-side lead at IG2 (cabin, under the ECU; the engine</text>
<text x="171.00" y="66.50" font-size="1.90" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">wire is removed)</text>
<text x="227.00" y="58.40" font-size="2.10" text-anchor="middle" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">w_alt_ig_ks | 16 AWG | Red (Blue-Yellow-Blue)</text>
<text x="265.00" y="58.40" font-size="2.10" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif">-&gt; Kill switch ALT 1 stud, trunk RH rear (HeavyDC) - alternator IG in</text>
<text x="17.00" y="77.10" font-size="2.50" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">pin 16</text>
<text x="50.00" y="77.10" font-size="2.30" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Y</text>
<text x="121.00" y="77.10" font-size="1.90" text-anchor="end" fill="#334" font-family="Helvetica, Arial, sans-serif">EWD 1993 p.74-75</text>
<text x="17.00" y="80.80" font-size="1.90" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">alternator L (G2-2) -&gt; splice I5 -&gt; combination meter lead C14-8 / C12-8 (ClusterLED charge LED)</text>
<text x="145.50" y="75.10" font-size="1.70" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">factory lead Y</text>
<circle cx="168.00" cy="76.50" r="1.50" fill="#14213d" stroke="none" stroke-width="0.20"/>
<text x="171.00" y="73.30" font-size="2.30" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">FL_OEM_IG2_C16</text>
<text x="171.00" y="80.50" font-size="1.90" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">crimp butt splice into the factory cowl-side lead at IG2 (cabin, under the ECU; the engine</text>
<text x="171.00" y="83.00" font-size="1.90" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">wire is removed)</text>
<text x="227.00" y="74.90" font-size="2.10" text-anchor="middle" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">w_alt_l_c | 20 AWG | White (Blue-White-White)</text>
<text x="265.00" y="74.90" font-size="2.10" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif">-&gt; Alternator plug G2 pin 2 (rear RH of engine; HeavyDC) - L charge lamp</text>
<text x="12.00" y="38.00" font-size="2.00" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">OEM box: only the plugs / cavities we splice are drawn</text>
<text x="10.00" y="98.00" font-size="1.90" text-anchor="start" fill="#555" font-family="Helvetica, Arial, sans-serif">Generated by docs/build/wiring-diagrams/build_wiring_diagrams.py from docs/harness/interfaces.json (flyingLeads); wire facts from the looms. Every cavity not shown stays factory.</text>
<text x="10.00" y="102.00" font-size="1.90" text-anchor="start" fill="#555" font-family="Helvetica, Arial, sans-serif">Splice dot = our wire butt-spliced into the factory lead. Wire label: wire id | gauge | insulation colour (ident bands). Far end: DECISIONS R156 form.</text>
