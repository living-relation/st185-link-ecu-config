<text x="10.00" y="114.50" font-size="1.90" text-anchor="start" fill="#555" font-family="Helvetica, Arial, sans-serif">Generated by docs/build/wiring-diagrams/build_wiring_diagrams.py from docs/harness/interfaces.json (flyingLeads); wire facts from the looms. Every cavity not shown stays factory.</text>
<text x="10.00" y="118.50" font-size="1.90" text-anchor="start" fill="#555" font-family="Helvetica, Arial, sans-serif">Splice dot = our wire butt-spliced into the factory lead. Wire label: wire id | gauge | insulation colour (ident bands). Far end: DECISIONS R156 form.</text>
