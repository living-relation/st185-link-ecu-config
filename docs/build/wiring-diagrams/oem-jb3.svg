<text x="10.00" y="19.00" font-size="2.30" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">OEM cowl junction block, KEPT. One splice: the GAUGE 15 A ignition lead (Mitchell 1993 Fig. 16, grid 63; 1992 p.132).</text>
<text x="17.00" y="53.80" font-size="2.70" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">J/B No.3 plug 3B</text>
<text x="17.00" y="60.60" font-size="2.50" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">pin 9</text>
<text x="50.00" y="60.60" font-size="2.30" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">R-L</text>
<text x="121.00" y="60.60" font-size="1.90" text-anchor="end" fill="#334" font-family="Helvetica, Arial, sans-serif">EWD Mitchell 1993 overall wiring F</text>
<text x="17.00" y="64.30" font-size="1.90" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">GAUGE 15A (J/B1 1E-5, ignition) -&gt; reverse relay k_rev 30 + back-up switch B1 pin 2</text>
<text x="145.50" y="58.60" font-size="1.70" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">factory lead R-L</text>
