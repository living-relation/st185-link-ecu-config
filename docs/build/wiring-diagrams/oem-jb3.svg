<text x="171.00" y="64.00" font-size="1.90" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">crimp butt splice into the factory R-L lead at J/B3 3B-9 (cabin side; its engine-wire leg</text>
<text x="171.00" y="66.50" font-size="1.90" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">to the switch is gone)</text>
<text x="227.00" y="58.40" font-size="2.10" text-anchor="middle" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">w_rev_gauge_cp | 16 AWG | Red (White)</text>
<text x="265.00" y="58.40" font-size="2.10" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif">-&gt; GAUGE 15A splice - J/B 3 feed to reverse relay pin 30 and the back-up switch</text>
<text x="12.00" y="38.00" font-size="2.00" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">OEM box: only the plugs / cavities we splice are drawn</text>
<text x="10.00" y="81.50" font-size="1.90" text-anchor="start" fill="#555" font-family="Helvetica, Arial, sans-serif">Generated by docs/build/wiring-diagrams/build_wiring_diagrams.py from docs/harness/interfaces.json (flyingLeads); wire facts from the looms. Every cavity not shown stays factory.</text>
<text x="10.00" y="85.50" font-size="1.90" text-anchor="start" fill="#555" font-family="Helvetica, Arial, sans-serif">Splice dot = our wire butt-spliced into the factory lead. Wire label: wire id | gauge | insulation colour (ident bands). Far end: DECISIONS R156 form.</text>
