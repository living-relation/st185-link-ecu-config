<text x="227.00" y="58.40" font-size="2.10" text-anchor="middle" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">w_gnd_id | 53.5 mm2 | Black</text>
<text x="265.00" y="58.40" font-size="2.10" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif">-&gt; POWER box bus zone (rev 7, glove box) pin GND</text>
