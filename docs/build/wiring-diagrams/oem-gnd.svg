<text x="10.00" y="19.00" font-size="2.30" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">OEM body ground points kept (EWD ground index p.169 / p.171; docs/electrical/ENGINE-ROOM-POWER-REDISTRIBUTION.md 5.2 / 5.3). A ring terminal goes on each factory ground bolt.</text>
<text x="17.00" y="53.80" font-size="2.70" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">Ground point ID (left kick panel)</text>
