<text x="227.00" y="83.90" font-size="2.10" text-anchor="middle" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">w_gnd_ig | 53.5 mm2 | Black</text>
<text x="265.00" y="83.90" font-size="2.10" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif">-&gt; POWER box bus zone (rev 7, glove box) pin GND</text>
<text x="12.00" y="38.00" font-size="2.00" text-anchor="start" fill="#14213d" font-family="Helvetica, Arial, sans-serif" font-weight="bold">OEM box: only the plugs / cavities we splice are drawn</text>
<text x="10.00" y="107.00" font-size="1.90" text-anchor="start" fill="#555" font-family="Helvetica, Arial, sans-serif">Generated by docs/build/wiring-diagrams/build_wiring_diagrams.py from docs/harness/interfaces.json (flyingLeads); wire facts from the looms. Every cavity not shown stays factory.</text>
<text x="10.00" y="111.00" font-size="1.90" text-anchor="start" fill="#555" font-family="Helvetica, Arial, sans-serif">Splice dot = our wire butt-spliced into the factory lead. Wire label: wire id | gauge | insulation colour (ident bands). Far end: DECISIONS R156 form.</text>
