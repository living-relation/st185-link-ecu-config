<text x="121.00" y="60.60" font-size="1.90" text-anchor="end" fill="#334" font-family="Helvetica, Arial, sans-serif">EWD EWD p.169</text>
<text x="17.00" y="64.30" font-size="1.90" text-anchor="start" fill="#222" font-family="Helvetica, Arial, sans-serif">body ground, kept (OEM ring)</text>
<text x="145.50" y="58.60" font-size="1.70" text-anchor="middle" fill="#333" font-family="Helvetica, Arial, sans-serif">factory lead B</text>
<circle cx="168.00" cy="60.00" r="1.50" fill="#14213d" stroke="none" stroke-width="0.20"/>
