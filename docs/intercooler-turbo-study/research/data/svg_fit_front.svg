"279" x2="314" y2="279" stroke="#4ea3ff"></line><line x1="94.4" y1="274" x2="94.4" y2="284" stroke="#4ea3ff"></line><line x1="314" y1="274" x2="314" y2="284" stroke="#4ea3ff"></line><text fill="#4ea3ff" font-size="11" text-anchor="middle" x="204.2" y="271">610 mm core width  (M1: need ≥ 640 mm clear aperture)</text><line x1="368.4" y1="101.04" x2="368.4" y2="209.04" stroke="#4ea3ff"></line><line x1="363.4" y1="101.04" x2="373.4" y2="101.04" stroke="#4ea3ff"></line><line x1="363.4" y1="209.04" x2="373.4" y2="209.04" stroke="#4ea3ff"></line><text fill="#4ea3ff" font-size="11" x="377.4" y="146.4">300 mm core height</text><text fill="#4ea3ff" font-size="9.5" x="377.4" y="156.48">M3: need ≥ 320 mm</text><text fill="#4ea3ff" font-size="9.5" x="377.4" y="165.48000000000002">clear aperture height</text><text fill="#e6edf5" font-size="12.5" font-weight="600" x="20" y="26">FRONT ELEVATION — intercooler shadow on the radiator</text><text fill="#6f8098" font-size="10.5" x="20" y="44">Looking at the front of the car. Intercooler centred on the radiator core.</text><text fill="#38d39f" font-size="11" x="80" y="309">Green strips = radiator core still seeing clean ambient air (~12% of its face). Keep them.</text><text fill="#6f8098" font-size="10.5" x="80" y="327">Mount the IC as low as the aperture allows, to preserve flow to the radiator's upper region.</text></svg>