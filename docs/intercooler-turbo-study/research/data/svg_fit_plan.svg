<svg viewBox="0 0 880 330" width="880" xmlns="http://www.w3.org/2000/svg" height="330" ><rect x="0" y="0" width="880" height="330" fill="#1a2029"/><defs><marker id="fa" markerWidth="7" markerHeight="6" refX="6" refY="3" orient="auto"><path d="M0 0 L7 3 L0 6 z" fill="#6f8098"></path></marker></defs><path d="M60 77 Q 60 165 60 253 L 78 253 Q 78 165 78 77 Z" fill="#212936" stroke="#6f8098" stroke-width="1.5"></path><text fill="#9fb0c4" font-size="10.5" text-anchor="middle" x="68" y="67">CS bumper</text><text fill="#9fb0c4" font-size="10.5" text-anchor="middle" x="68" y="79">skin</text><path d="M78 113 L150 95 L150 235 L78 217 Z" fill="#16302a" stroke="#38d39f" stroke-width="1.6"></path><text fill="#38d39f" font-size="10.5" text-anchor="middle" x="112" y="269">DUCT</text><rect x="150" y="95" width="62" height="140" fill="#1c2836" stroke="#4ea3ff" stroke-width="2"></rect><text fill="#4ea3ff" font-size="13" text-anchor="middle" font-weight="700" x="181" y="159">IC</text><text fill="#4ea3ff" font-size="10" text-anchor="middle" x="181" y="174">75 mm</text><rect x="212" y="95" width="22" height="140" fill="none" stroke="#3a4757" stroke-dasharray="3 3"></rect><text fill="#6f8098" font-size="9" text-anchor="middle" x="223" y="251">15–25</text><rect x="234" y="89" width="26" height="152" fill="#2a2436" stroke="#b28ee0" stroke-width="1.6"></rect><text fill="#b28ee0" font-size="10.5" text-anchor="middle" x="247" y="165">A/C</text><text fill="#b28ee0" font-size="9.5" text-anchor="middle" x="247" y="178">cond</text><rect x="260" y="95" width="14" height="140" fill="none" stroke="#3a4757" stroke-dasharray="3 3"></rect><rect x="274" y="81" width="40" height="168" fill="#2a2118" stroke="#ffb347" stroke-width="2"></rect><text fill="#ffb347" font-size="12" text-anchor="middle" font-weight="700" x="294" y="159">RAD</text><text fill="#ffb347" font-size="9.5" text-anchor="middle" x="294" y="174">40 mm</text><rect x="314" y="89" width="34" height="152" fill="#1a2029" stroke="#6f8098" stroke-dasharray="4 3"></rect><text fill="#9fb0c4" font-size="10" text-anchor="middle" x="331" y="165">fans</text><rect x="96" y="152" width="26" height="26" fill="#3d1a1a" stroke="#ff6b6b" stroke-width="1.6" rx="3"></rect><text fill="#ff8f8f" font-size="9.5" text-anchor="middle" x="109" y="169">CB</text><text fill="#ff8f8f" font-size="10" text-anchor="middle" x="109" y="61">crash bar</text><text fill="#ff8f8f" font-size="8.5" text-anchor="middle" x="109" y="72">(section/relocate)</text><line x1="78" y1="293" x2="234" y2="293" stroke="#ffb347" stroke-width="1"></line><line x1="78" y1="288" x2="78" y2="298" stroke="#ffb347"></line><line x1="234" y1="288" x2="234" y2="298" stroke="#ffb347"></line><text fill="#ffb347" font-size="10.5" text-anchor="middle" x="156" y="286">M2 — need ≥ 110 mm bumper skin to condenser</text><line x1="150" y1="317" x2="348" y2="317" stroke="#6f8098" stroke-width="1"></line><line x1="150" y1="312" x2="150" y2="322" stroke="#6f8098"></line><line x1="348" y1="312" x2="348" y2="322" stroke="#6f8098"></line><text fill="#6f8098" font-size="10.5" text-anchor="middle" x="249" y="310">total stack ≈ 200 mm</text><line x1="14" y1="117" x2="56" y2="117" stroke="#6f8098" stroke-width="1.5" marker-end="url(#fa)"></line><line x1="14" y1="149" x2="56" y2="149" stroke="#6f8098" stroke-width="1.5" marker-end="url(#fa)"></line><line x1="14" y1="181" x2="56" y2="181" stroke="#6f8098" stroke-width="1.5" marker-end="url(#fa)"></line><line x1="14" y1="213" x2="56" y2="213" stroke="#6f8098" stroke-width="1.5" marker-end="url(#fa)"></line><text fill="#9fb0c4" font-size="10.5" x="14" y="71">AIR</text><text fill="#e6edf5" font-size="12.5" font-weight="600" x="400" y="50">PLAN VIEW — looking down at the front of the car</text><rect x="400" y="76" width="11" height="11" fill="#4ea3ff" rx="2"></rect><text fill="#9fb0c4" font-size="11" x="419" y="86">Intercooler 75 mm — the recommended CSF 8067</text><rect x="400" y="99" width="11" height="11" fill="#38d39f" rx="2"></rect><text fill="#9fb0c4" font-size="11" x="419" y="109">Duct must seal to the bumper aperture on all 4 edges</text><rect x="400" y="122" width="11" height="11" fill="#3a4757" rx="2"></rect><text fill="#9fb0c4" font-size="11" x="419" y="132">15–25 mm gap after the IC lets the exit jet spread</text><rect x="400" y="145" width="11" height="11" fill="#b28ee0" rx="2"></rect><text fill="#9fb0c4" font-size="11" x="419" y="155">A/C condenser retained — the binding depth constraint</text><rect x="400" y="168" width="11" height="11" fill="#ffb347" rx="2"></rect><text fill="#9fb0c4" font-size="11" x="419" y="178">Radiator core 690 × 325 × 40 (confirmed ST185 spec)</text><rect x="400" y="191" width="11" height="11" fill="#ff6b6b" rx="2"></rect><text fill="#9fb0c4" font-size="11" x="419" y="201">Crash bar routinely sectioned on this chassis to fit</text><rect x="400" y="214" width="11" height="11" fill="#6f8098" rx="2"></rect><text fill="#9fb0c4" font-size="11" x="419" y="224">Engine bay MUST vent or none of this flows</text><text fill="#ffb347" font-size="11" font-weight="600" x="400" y="255">⚠ All depths are estimates from adjacent known parts.</text><text fill="#ffb347" font-size="11" x="400" y="271">Measure M1–M4 on your own car before ordering.</text></svg>