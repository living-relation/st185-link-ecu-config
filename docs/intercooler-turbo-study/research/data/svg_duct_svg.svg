fb0c4" font-size="10" x="330" y="139">splitter vane (if length-limited)</text><line x1="84" y1="110" x2="159" y2="110" stroke="#4ea3ff" stroke-width="1.8"></line><path d="M159 106 L166 110 L159 114 Z" fill="#4ea3ff"></path><line x1="84" y1="128" x2="159" y2="128" stroke="#4ea3ff" stroke-width="1.8"></line><path d="M159 124 L166 128 L159 132 Z" fill="#4ea3ff"></path><line x1="84" y1="146" x2="159" y2="146" stroke="#4ea3ff" stroke-width="1.8"></line><path d="M159 142 L166 146 L159 150 Z" fill="#4ea3ff"></path><line x1="84" y1="164" x2="159" y2="164" stroke="#4ea3ff" stroke-width="1.8"></line><path d="M159 160 L166 164 L159 168 Z" fill="#4ea3ff"></path><line x1="84" y1="182" x2="159" y2="182" stroke="#4ea3ff" stroke-width="1.8"></line><path d="M159 178 L166 182 L159 186 Z" fill="#4ea3ff"></path><text fill="#4ea3ff" font-size="11" font-weight="600" x="84" y="96">RAM AIR</text><line x1="170" y1="105" x2="170" y2="185" stroke="#ffb347" stroke-width="1"></line><line x1="165" y1="105" x2="175" y2="105" stroke="#ffb347"></line><line x1="165" y1="185" x2="175" y2="185" stroke="#ffb347"></line><text fill="#ffb347" font-size="10" x="178" y="206">MOUTH — 50–70% of core face area</text><line x1="534" y1="60" x2="534" y2="230" stroke="#4ea3ff" stroke-width="1"></line><line x1="529" y1="60" x2="539" y2="60" stroke="#4ea3ff"></line><line x1="529" y1="230" x2="539" y2="230" stroke="#4ea3ff"></line><text fill="#4ea3ff" font-size="10" x="542" y="250">300 mm</text><path d="M236 92 A 62 62 0 0 1 248 80" fill="none" stroke="#ff6b6b" stroke-width="1.4"></path><line x1="180" y1="105" x2="460" y2="105" stroke="#3a4757" stroke-width="1" stroke-dasharray="4 3"></line><text fill="#ff6b6b" font-size="11" font-weight="600" x="256" y="88">≤ 7° per wall  (≤ 14° total included)</text><text fill="#6f8098" font-size="9.5" x="256" y="101">beyond ~15° total the flow separates and you lose pressure recovery</text><line x1="540" y1="148" x2="599" y2="148" stroke="#ffb347" stroke-width="1.8"></line><path d="M599 144 L606 148 L599 152 Z" fill="#ffb347"></path><text fill="#ffb347" font-size="10.5" x="614" y="144">heated air → condenser → radiator</text><text fill="#ff6b6b" font-size="10" x="614" y="158">MUST have an exit path from the bay</text><text fill="#e6edf5" font-size="12.5" font-weight="600" x="20" y="24">DUCT GEOMETRY — plan view</text><text fill="#38d39f" font-size="11" font-weight="600" x="20" y="272">Sealing all four edges is worth more than any core upgrade in this report.</text></g></svg>